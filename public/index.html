  accent:"#5b8def",accentGlow:"rgba(91,141,239,.12)",
  red:"#ef5b6c",redGlow:"rgba(239,91,108,.10)",
  orange:"#f09a3e",orangeGlow:"rgba(240,154,62,.10)",
  green:"#4ecb71",greenGlow:"rgba(78,203,113,.10)",
  blue:"#4eadef",blueGlow:"rgba(78,173,239,.10)",
  cyan:"#4ed4cb",
  purple:"#a78ef5",purpleGlow:"rgba(167,142,245,.10)",
  yellow:"#f5d44e",
  mono:"'JetBrains Mono','Fira Code',monospace",
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const fmt = v => `$${Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const fmtK = v => v>=1e6?`${(v/1e6).toFixed(1)}M`:v>=1000?`${(v/1000).toFixed(0)}K`:String(v||0);
const fmtModel = m => {
  if(!m) return m;
  if(m.includes("haiku-4-5")) return "Haiku 4.5 ⚠";
  if(m.includes("sonnet-4-5")) return "Sonnet 4.5 ⚠";
  if(m.includes("sonnet-4-6")) return "Sonnet 4.6";
  if(m.includes("opus-4-7")) return "Opus 4.7";
  if(m.includes("opus-4-6")) return "Opus 4.6";
  if(m.includes("opus")) return "Opus";
  if(m.includes("sonnet")) return "Sonnet";
  if(m.includes("haiku")) return "Haiku";
  return m;
};

function Bar({value, max, color, h=4}) {
  const pct = max>0 ? Math.min(100,(value/max)*100) : 0;
  return (
    <div style={{background:C.border,borderRadius:3,height:h,overflow:"hidden"}}>
      <div style={{width:`${pct}%`,height:"100%",background:color,borderRadius:3,transition:"width .3s"}} />
    </div>
  );
}

function ModelBar({models}) {
  const buckets = [["sonnet",C.accent],["opus",C.red],["haiku",C.green]];
  const total = Object.values(models||{}).reduce((a,b)=>a+b,0);
  if(!total) return <span style={{color:C.dim,fontSize:11}}>—</span>;
  return (
    <div style={{display:"flex",height:6,borderRadius:4,overflow:"hidden",gap:1}}>
      {buckets.map(([k,col])=>{
        const v=models?.[k]||0, pct=(v/total)*100;
        if(pct<0.5) return null;
        return <div key={k} style={{width:`${pct}%`,background:col,minWidth:2}} title={`${k}: ${fmt(v)}`}/>;
      })}
    </div>
  );
}

function Sparkline({values, color=C.accent, w=70, h=22}) {
  if(!values||values.length<2) return (
    <svg width={w} height={h}><circle cx={w/2} cy={h/2} r={2.5} fill={color} opacity={.6}/></svg>
  );
  const mn=Math.min(...values), mx=Math.max(...values), range=mx-mn||1, pad=3;
  const pts = values.map((v,i)=>{
    const x=pad+(i/(values.length-1))*(w-2*pad);
    const y=(h-pad)-((v-mn)/range)*(h-2*pad);
    return `${x},${y}`;
  });
  return (
    <svg width={w} height={h} style={{display:"block"}}>
      <polyline points={pts.join(" ")} fill="none" stroke={color} strokeWidth={1.5} strokeLinejoin="round" strokeLinecap="round"/>
    </svg>
  );
}

function FlagPill({type}) {
  const map={
    "max-plan":{l:"Max Plan",bg:C.redGlow,c:C.red},
    "opus-heavy":{l:"Opus Heavy",bg:C.purpleGlow,c:C.purple},
    "cowork-opus":{l:"Cowork Opus",bg:C.orangeGlow,c:C.orange},
    "token-density":{l:"Token Density",bg:C.orangeGlow,c:C.orange},
    "legacy":{l:"Legacy",bg:"rgba(245,212,78,.08)",c:C.yellow},
    "low-engagement":{l:"Low Usage",bg:C.blueGlow,c:C.blue},
  };
  const s=map[type]||{l:type,bg:C.border,c:C.muted};
  return <span style={{fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:5,background:s.bg,color:s.c,letterSpacing:".04em",whiteSpace:"nowrap"}}>{s.l}</span>;
}

function StatCard({label,value,sub,color}) {
  return (
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"16px 18px"}}>
      <div style={{fontSize:11,textTransform:"uppercase",letterSpacing:".08em",color:C.dim,marginBottom:8,fontWeight:500}}>{label}</div>
      <div style={{fontSize:26,fontWeight:800,fontFamily:C.mono,color:color||C.text,letterSpacing:"-.03em"}}>{value}</div>
      {sub&&<div style={{fontSize:12,color:C.dim,marginTop:5}}>{sub}</div>}

}

function FlagCard({icon,title,count,color,glowColor,children}) {

function AllUsersTab() {
  const [sortKey,setSortKey]=useState("spend");
  const [sortDir,setSortDir]=useState("desc");
  const [search,setSearch]=useState("");
  const [expanded,setExpanded]=useState(null);

  const sorted = useMemo(()=>{
    const q=search.toLowerCase();
    const filtered=AU.filter(u=>{
      if(!q) return true;
      const top=Object.entries(u.products||{}).sort((a,b)=>b[1]-a[1])[0];
      return u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q)||(top&&top[0].toLowerCase().includes(q));
    });
    const dir=sortDir==="asc"?1:-1;
    return [...filtered].sort((a,b)=>{
      let va=a[sortKey],vb=b[sortKey];
      if(sortKey==="topProduct"){
        va=Object.entries(a.products||{}).sort((x,y)=>y[1]-x[1])[0]?.[1]||0;
        vb=Object.entries(b.products||{}).sort((x,y)=>y[1]-x[1])[0]?.[1]||0;
      }
      if(typeof va==="string") return va.localeCompare(vb)*dir;
      return ((va||0)-(vb||0))*dir;
    });
  },[sortKey,sortDir,search]);

  const setSort=k=>{
    if(sortKey===k) setSortDir(d=>d==="asc"?"desc":"asc");
    else{setSortKey(k);setSortDir("desc");}
  };

  const headers=[
    {k:"name",l:"Name"},{k:"email",l:"Email"},{k:"spend",l:"Spend"},
    {k:"requests",l:"Reqs"},{k:"cpr",l:"$/Req"},{k:"avgPromptTokens",l:"Avg Tokens"},
    {k:"modelMix",l:"Model Mix",ns:true},{k:"trend",l:"Trend",ns:true},
    {k:"topProduct",l:"Top Product"},{k:"flags",l:"Flags",ns:true},
  ];

  return (
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
      <div style={{padding:"13px 18px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:12}}>
        <span style={{fontSize:13,fontWeight:600}}>All Active Users ({AU.length})</span>
        <span style={{fontSize:12,color:C.dim}}>Showing {sorted.length}</span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, email, or product…"
          style={{marginLeft:"auto",background:C.bg,border:`1px solid ${C.border}`,color:C.text,fontSize:12,padding:"5px 10px",borderRadius:6,outline:"none",width:260,fontFamily:"inherit"}}/>
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead>
            <tr style={{borderBottom:`1px solid ${C.border}`}}>
              {headers.map(h=>(
                <th key={h.k} onClick={()=>!h.ns&&setSort(h.k)} style={{padding:"9px 12px",textAlign:"left",fontSize:11,color:sortKey===h.k?C.accent:C.dim,fontWeight:500,textTransform:"uppercase",letterSpacing:".06em",cursor:h.ns?"default":"pointer",userSelect:"none",whiteSpace:"nowrap"}}>
                  {h.l}{!h.ns&&sortKey===h.k&&(sortDir==="asc"?" ↑":" ↓")}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sorted.map(u=>{
              const isOpen=expanded===u.email;
              const top=Object.entries(u.products||{}).sort((a,b)=>b[1]-a[1])[0];
              const sc=u.spend>200?C.red:u.spend>100?C.orange:u.spend<10?C.blue:C.text;
              return (
                <>
                  <tr key={u.email} onClick={()=>setExpanded(isOpen?null:u.email)}
                    style={{borderBottom:isOpen?"none":`1px solid ${C.border}`,cursor:"pointer",background:isOpen?C.cardHover:"transparent"}}>
                    <td style={{padding:"9px 12px"}}>
                      <span style={{color:C.dim,marginRight:6,fontSize:10}}>{isOpen?"▾":"▸"}</span>
                      <span style={{fontWeight:500}}>{u.name}</span>
                    </td>

// ─── TRENDS TAB ──────────────────────────────────────────────────────────────
function MiniChart({data,color,h=60}) {
  const vals=data.map(d=>d.v);
  const mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1;
  const pad=8,W=320,H=h;
  const pts=vals.map((v,i)=>{
    const x=pad+(i/(vals.length-1))*(W-2*pad);
    const y=(H-pad)-((v-mn)/range)*(H-2*pad);
    return `${x},${y}`;
  });
  const gid=`g${color.replace(/[^a-z0-9]/gi,'')}`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:h,display:"block"}}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.15"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polygon points={`${pad},${H} ${pts.join(" ")} ${W-pad},${H}`} fill={`url(#${gid})`}/>
      <polyline points={pts.join(" ")} fill="none" stroke={color} strokeWidth={2} strokeLinejoin="round" strokeLinecap="round"/>
      {vals.map((v,i)=>{
        const x=pad+(i/(vals.length-1))*(W-2*pad);
        const y=(H-pad)-((v-mn)/range)*(H-2*pad);
        return <circle key={i} cx={x} cy={y} r={2.5} fill={color}/>;
      })}
    </svg>
  );
}

function TrendsTab() {
  const weeks=HIST_WEEKS||[];
  if(!weeks.length) return <div style={{color:C.dim,padding:40,textAlign:"center"}}>No history loaded.</div>;
  const spendData=weeks.map(w=>({label:w.weekOf,v:w.totalSpend}));
  const opusData=weeks.map(w=>({label:w.weekOf,v:w.opusSpend}));
  const userData=weeks.map(w=>({label:w.weekOf,v:w.activeUsers}));
  const flagData=weeks.map(w=>({label:w.weekOf,v:(w.flagCounts?.opusHeavy||0)+(w.flagCounts?.coworkOpus||0)}));
  const totalAll=weeks.reduce((a,w)=>a+w.totalSpend,0);
  const peak=Math.max(...weeks.map(w=>w.totalSpend));
  const latest=weeks[weeks.length-1];
  const prev=weeks[weeks.length-2];
  const spendDelta=prev?((latest.totalSpend-prev.totalSpend)/prev.totalSpend*100).toFixed(1):null;

  const chartRows=[
    {title:"Weekly Org Spend",data:spendData,color:C.accent,fmtV:v=>`$${(v/1000).toFixed(1)}K`},
    {title:"Active Users",data:userData,color:C.green,fmtV:v=>Math.round(v).toLocaleString()},
    {title:"Weekly Opus Spend",data:opusData,color:C.red,fmtV:v=>`$${(v/1000).toFixed(1)}K`},
    {title:"Opus-Heavy + Cowork Flags",data:flagData,color:C.orange,fmtV:v=>Math.round(v).toString()},
  ];

  return (
    <>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
        <StatCard label="Weeks Tracked" value={weeks.length} sub={`${weeks[0].weekOf.split('–')[0].trim()} → now`}/>
        <StatCard label="This Week vs Prior" value={spendDelta?(spendDelta>0?`+${spendDelta}%`:`${spendDelta}%`):fmt(latest.totalSpend)} color={spendDelta&&spendDelta>0?C.red:C.green} sub="spend change"/>
        <StatCard label="Peak Weekly Spend" value={fmt(peak)} color={C.orange}/>
        <StatCard label="12-Week Total" value={`$${(totalAll/1000).toFixed(0)}K`} color={C.accent}/>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
        {chartRows.map(({title,data,color,fmtV})=>(
          <div key={title} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:18}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{title}</div>
            <div style={{fontSize:24,fontWeight:800,fontFamily:C.mono,color,marginBottom:10}}>{fmtV(data[data.length-1].v)}</div>
            <MiniChart data={data} color={color} h={60}/>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:8,paddingTop:6,borderTop:`1px solid ${C.border}`}}>
              {data.filter((_,i)=>i===0||i===Math.floor(data.length/2)||i===data.length-1).map((d,i)=>(
                <div key={i} style={{fontSize:10,color:C.dim,textAlign:"center"}}>
                  <div style={{color,fontWeight:600}}>{fmtV(d.v)}</div>
                  <div>{d.label.replace(/, 2026/,'').split('–')[0].trim()}</div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:18}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:14}}>Week-over-Week Detail (newest first)</div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead>
              <tr style={{borderBottom:`1px solid ${C.border}`}}>
                {["Week","Spend","Δ","Users","Avg/User","Opus","Sonnet","Max Plan","Cowork Opus","Opus Heavy","Low Eng."].map(h=>(
                  <th key={h} style={{padding:"7px 10px",textAlign:"right",fontSize:10,color:C.dim,fontWeight:500,textTransform:"uppercase",letterSpacing:".05em",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[...weeks].reverse().map((w,i,arr)=>{
                const isLatest=i===0;
                const priorW=arr[i+1];
                const delta=priorW?((w.totalSpend-priorW.totalSpend)/priorW.totalSpend*100).toFixed(1):null;
                return (
                  <tr key={w.weekStartISO} style={{borderBottom:`1px solid ${C.border}`,background:isLatest?C.accentGlow:"transparent"}}>
                    <td style={{padding:"7px 10px",textAlign:"right",fontSize:11,color:isLatest?C.accent:C.muted,fontWeight:isLatest?700:400,whiteSpace:"nowrap"}}>{w.weekOf.replace(/, 2026/,'').replace(/,2026/,'')}</td>
                    <td style={{padding:"7px 10px",textAlign:"right",fontFamily:C.mono,fontWeight:600,color:isLatest?C.accent:C.text}}>{fmt(w.totalSpend)}</td>
                    <td style={{padding:"7px 10px",textAlign:"right",fontFamily:C.mono,fontSize:11,color:delta===null?C.dim:delta>0?C.red:C.green}}>{delta===null?"—":(delta>0?`+${delta}%`:`${delta}%`)}</td>
                    <td style={{padding:"7px 10px",textAlign:"right",fontFamily:C.mono,color:C.muted}}>{w.activeUsers}</td>
                    <td style={{padding:"7px 10px",textAlign:"right",fontFamily:C.mono,color:C.muted}}>{fmt(w.avgSpend)}</td>
                    <td style={{padding:"7px 10px",textAlign:"right",fontFamily:C.mono,color:C.red}}>{fmt(w.opusSpend)}</td>
                    <td style={{padding:"7px 10px",textAlign:"right",fontFamily:C.mono,color:C.accent}}>{fmt(w.sonnetSpend)}</td>
                    <td style={{padding:"7px 10px",textAlign:"right",fontFamily:C.mono,color:C.dim}}>{w.flagCounts?.maxPlan??0}</td>
                    <td style={{padding:"7px 10px",textAlign:"right",fontFamily:C.mono,color:C.orange}}>{w.flagCounts?.coworkOpus??0}</td>
                    <td style={{padding:"7px 10px",textAlign:"right",fontFamily:C.mono,color:C.purple}}>{w.flagCounts?.opusHeavy??0}</td>
                    <td style={{padding:"7px 10px",textAlign:"right",fontFamily:C.mono,color:C.blue}}>{w.flagCounts?.lowEngagement??0}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}
