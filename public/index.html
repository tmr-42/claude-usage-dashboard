const C = {
  bg:"#0a0b0f",card:"#12141a",cardHover:"#161820",border:"#1e2030",borderLight:"#252840",
  text:"#e8eaf0",muted:"#9aa0b8",dim:"#555870",
  accent:"#5b8def",accentGlow:"rgba(91,141,239,.12)",
  red:"#ef5b6c",redGlow:"rgba(239,91,108,.10)",
  orange:"#f09a3e",orangeGlow:"rgba(240,154,62,.10)",
  green:"#4ecb71",greenGlow:"rgba(78,203,113,.10)",
  blue:"#4eadef",blueGlow:"rgba(78,173,239,.10)",
  cyan:"#4ed4cb",

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const fmt = v => `$${Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const fmtK = v => v>=1e6?`${(v/1e6).toFixed(1)}M`:v>=1000?`${(v/1000).toFixed(0)}K`:String(v||0);
const fmtModel = m => {
  if(!m) return m;
  if(m.includes("haiku-4-5")) return "Haiku 4.5 ⚠";
  if(m.includes("sonnet-4-5")) return "Sonnet 4.5 ⚠";
  if(m.includes("sonnet-4-6")) return "Sonnet 4.6";
  if(m.includes("opus-4-7")) return "Opus 4.7";
  if(m.includes("opus-4-6")) return "Opus 4.6";
  if(m.includes("opus")) return "Opus";
  if(m.includes("sonnet")) return "Sonnet";
  if(m.includes("haiku")) return "Haiku";
  return m;
};

function Bar({value, max, color, h=4}) {
  const pct = max>0 ? Math.min(100,(value/max)*100) : 0;
  return (
    <div style={{background:C.border,borderRadius:3,height:h,overflow:"hidden"}}>
      <div style={{width:`${pct}%`,height:"100%",background:color,borderRadius:3,transition:"width .3s"}} />
    </div>
  );
}

function ModelBar({models}) {
  const buckets = [["sonnet",C.accent],["opus",C.red],["haiku",C.green]];
  const total = Object.values(models||{}).reduce((a,b)=>a+b,0);
  if(!total) return <span style={{color:C.dim,fontSize:11}}>—</span>;
  return (
    <div style={{display:"flex",height:6,borderRadius:4,overflow:"hidden",gap:1}}>
      {buckets.map(([k,col])=>{
        const v=models?.[k]||0, pct=(v/total)*100;
        if(pct<0.5) return null;
        return <div key={k} style={{width:`${pct}%`,background:col,minWidth:2}} title={`${k}: ${fmt(v)}`}/>;
      })}
    </div>
  );
}

function Sparkline({values, color=C.accent, w=70, h=22}) {
  if(!values||values.length<2) return (
    <svg width={w} height={h}><circle cx={w/2} cy={h/2} r={2.5} fill={color} opacity={.6}/></svg>
  );
  const mn=Math.min(...values), mx=Math.max(...values), range=mx-mn||1, pad=3;
  const pts = values.map((v,i)=>{
    const x=pad+(i/(values.length-1))*(w-2*pad);
    const y=(h-pad)-((v-mn)/range)*(h-2*pad);
    return `${x},${y}`;
  });
  return (
    <svg width={w} height={h} style={{display:"block"}}>

// ─── ALL USERS TAB ───────────────────────────────────────────────────────────
function AllUsersTab() {
  const [sortKey,setSortKey]=useState("spend");
  const [sortDir,setSortDir]=useState("desc");
  const [search,setSearch]=useState("");
  const [expanded,setExpanded]=useState(null);

  const sorted = useMemo(()=>{
    const q=search.toLowerCase();
    const filtered=AU.filter(u=>{
      if(!q) return true;
      const top=Object.entries(u.products||{}).sort((a,b)=>b[1]-a[1])[0];
      return u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q)||(top&&top[0].toLowerCase().includes(q));
    });
    const dir=sortDir==="asc"?1:-1;
    return [...filtered].sort((a,b)=>{
      let va=a[sortKey],vb=b[sortKey];
      if(sortKey==="topProduct"){
        va=Object.entries(a.products||{}).sort((x,y)=>y[1]-x[1])[0]?.[1]||0;
        vb=Object.entries(b.products||{}).sort((x,y)=>y[1]-x[1])[0]?.[1]||0;
      }
      if(typeof va==="string") return va.localeCompare(vb)*dir;
      return ((va||0)-(vb||0))*dir;
    });
  },[sortKey,sortDir,search]);

  const setSort=k=>{
    if(sortKey===k) setSortDir(d=>d==="asc"?"desc":"asc");
    else{setSortKey(k);setSortDir("desc");}
  };

  const headers=[
    {k:"name",l:"Name"},{k:"email",l:"Email"},{k:"spend",l:"Spend"},
    {k:"requests",l:"Reqs"},{k:"cpr",l:"$/Req"},{k:"avgPromptTokens",l:"Avg Tokens"},
    {k:"modelMix",l:"Model Mix",ns:true},{k:"trend",l:"Trend",ns:true},
    {k:"topProduct",l:"Top Product"},{k:"flags",l:"Flags",ns:true},
  ];

  return (
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
      <div style={{padding:"13px 18px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:12}}>
        <span style={{fontSize:13,fontWeight:600}}>All Active Users ({AU.length})</span>
        <span style={{fontSize:12,color:C.dim}}>Showing {sorted.length}</span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, email, or product…"
          style={{marginLeft:"auto",background:C.bg,border:`1px solid ${C.border}`,color:C.text,fontSize:12,padding:"5px 10px",borderRadius:6,outline:"none",width:260,fontFamily:"inherit"}}/>
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead>
            <tr style={{borderBottom:`1px solid ${C.border}`}}>
              {headers.map(h=>(
                <th key={h.k} onClick={()=>!h.ns&&setSort(h.k)} style={{padding:"9px 12px",textAlign:"left",fontSize:11,color:sortKey===h.k?C.accent:C.dim,fontWeight:500,textTransform:"uppercase",letterSpacing:".06em",cursor:h.ns?"default":"pointer",userSelect:"none",whiteSpace:"nowrap"}}>
                  {h.l}{!h.ns&&sortKey===h.k&&(sortDir==="asc"?" ↑":" ↓")}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sorted.map(u=>{
              const isOpen=expanded===u.email;
              const top=Object.entries(u.products||{}).sort((a,b)=>b[1]-a[1])[0];
              const sc=u.spend>200?C.red:u.spend>100?C.orange:u.spend<10?C.blue:C.text;
              return (
                <>
                  <tr key={u.email} onClick={()=>setExpanded(isOpen?null:u.email)}
                    style={{borderBottom:isOpen?"none":`1px solid ${C.border}`,cursor:"pointer",background:isOpen?C.cardHover:"transparent"}}>
                    <td style={{padding:"9px 12px"}}>
                      <span style={{color:C.dim,marginRight:6,fontSize:10}}>{isOpen?"▾":"▸"}</span>
                      <span style={{fontWeight:500}}>{u.name}</span>
                    </td>
                    <td style={{padding:"9px 12px",fontSize:11,color:C.dim}}>{u.email.split("@")[0]}</td>
                    <td style={{padding:"9px 12px",fontFamily:C.mono,fontWeight:600,color:sc}}>{fmt(u.spend)}</td>
                    <td style={{padding:"9px 12px",fontFamily:C.mono,color:C.muted}}>{u.requests.toLocaleString()}</td>
                    <td style={{padding:"9px 12px",fontFamily:C.mono,color:u.cpr>0.5?C.orange:C.muted}}>{fmt(u.cpr)}</td>
                    <td style={{padding:"9px 12px",fontFamily:C.mono,color:C.muted}}>{fmtK(u.avgPromptTokens||0)}</td>
                    <td style={{padding:"9px 12px",width:120}}>
                      <ModelBar models={u.models||{}}/>
                      {u.opusPct>0&&<div style={{fontSize:10,color:C.red,marginTop:2}}>{u.opusPct}%</div>}
                    </td>
                    <td style={{padding:"9px 12px"}}>
                      <Sparkline values={u.sparkline||[u.spend]} color={C.accent}/>
                    </td>
                    <td style={{padding:"9px 12px",fontSize:12,color:C.muted,whiteSpace:"nowrap"}}>{top?`${top[0]} (${fmt(top[1])})`:"—"}</td>
                    <td style={{padding:"9px 12px"}}>
                      <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                        {(u.flags||[]).map(f=><FlagPill key={f} type={f}/>)}
                      </div>
                    </td>
                  </tr>
                  {isOpen&&<UserDetailPanel key={`${u.email}-d`} u={u}/>}
                </>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

          <div key={u.email} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 18px",borderBottom:`1px solid ${C.border}`}}>
            <span style={{flex:1,fontWeight:500,fontSize:13}}>{u.name}</span>
            <span style={{fontFamily:C.mono,fontSize:13,color:C.red,fontWeight:600}}>{fmt(u.weeklySpend)}/wk</span>
            <span style={{fontFamily:C.mono,fontSize:12,color:C.dim}}>→ ~{fmt(u.projectedMonthly)}/mo</span>
          </div>
        ))}
      </FlagCard>

      <FlagCard icon="🟠" title="Cowork → Opus (Automated Routing)" count={CO.length} color={C.orange} glowColor={C.orangeGlow}>
        <div style={{padding:"10px 18px",fontSize:12,color:C.dim,borderBottom:`1px solid ${C.border}`}}>Highest-priority cost item. No human selected Opus — Cowork routed automatically.</div>
        {CO.map(u=>(
          <div key={u.email} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 18px",borderBottom:`1px solid ${C.border}`}}>
            <span style={{flex:1,fontWeight:500,fontSize:13}}>{u.name}</span>
            <span style={{fontFamily:C.mono,fontSize:13,color:C.orange,fontWeight:600}}>{fmt(u.spend)}</span>
            <span style={{fontSize:12,color:C.dim}}>{u.requests} reqs</span>
            <span style={{fontSize:11,color:C.dim,fontFamily:C.mono}}>{fmtModel(u.model)}</span>
          </div>
        ))}
      </FlagCard>

      <FlagCard icon="🟣" title={`Opus-Heavy Chat (≥30% Chat spend) — showing ≥$10`} count={OH.filter(u=>u.opusSpend>=10).length} color={C.purple} glowColor={C.purpleGlow}>
        <div style={{padding:"10px 18px",fontSize:12,color:C.dim,borderBottom:`1px solid ${C.border}`}}>≥30% of Chat spend on Opus. Excludes Claude Code.</div>
        {OH.filter(u=>u.opusSpend>=10).map(u=>(
          <div key={u.email} style={{display:"flex",alignItems:"center",gap:12,padding:"9px 18px",borderBottom:`1px solid ${C.border}`}}>
            <span style={{flex:1,fontWeight:500,fontSize:13}}>{u.name}</span>
            <span style={{fontFamily:C.mono,fontSize:12,color:C.purple}}>{fmt(u.opusSpend)} Opus</span>
            <span style={{fontSize:12,color:C.dim}}>/ {fmt(u.chatSpend)} Chat</span>
            <span style={{background:C.purpleGlow,color:C.purple,fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:8}}>{u.opusPct}%</span>
          </div>
        ))}
      </FlagCard>

      <FlagCard icon="📐" title="High Token Density (>500K avg prompt)" count={0} color={C.orange} glowColor={C.orangeGlow}>
        <div style={{padding:"14px 18px",fontSize:12,color:C.dim}}>✓ No users above threshold this week.</div>
      </FlagCard>

      <FlagCard icon="⚠️" title={`Legacy Model Usage (${LM_TOTAL} total — showing top 20)`} count={LM_TOTAL} color={C.yellow} glowColor="rgba(245,212,78,.06)">
        <div style={{padding:"10px 18px",fontSize:12,color:C.dim,borderBottom:`1px solid ${C.border}`}}>Deprecated versions (Haiku 4.5, Sonnet 4.5). Migrate to Sonnet 4.6 / Opus 4.7.</div>
        {LM.map(u=>(
          <div key={u.email} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 18px",borderBottom:`1px solid ${C.border}`}}>
            <span style={{flex:1,fontWeight:500,fontSize:13}}>{u.name}</span>
            <span style={{fontSize:11,color:C.dim,fontFamily:C.mono}}>{Object.keys(u.models||{}).map(fmtModel).join(", ")}</span>
            <span style={{fontFamily:C.mono,fontSize:12,color:C.yellow}}>{fmt(u.spend)}</span>
          </div>
        ))}
        {LM_TOTAL>20&&<div style={{padding:"8px 18px",fontSize:12,color:C.dim}}>…and {LM_TOTAL-20} more</div>}
      </FlagCard>

      <div style={{marginTop:28,paddingTop:20,borderTop:`1px dashed ${C.borderLight}`}}>
        <div style={{fontSize:11,textTransform:"uppercase",letterSpacing:".1em",color:C.blue,marginBottom:12,fontWeight:600}}>Separate category — Engagement, not cost</div>
        <FlagCard icon="💧" title={`Low Engagement (<$10/wk — ${LE_TOTAL} users, 0 DM-eligible)`} count={LE_TOTAL} color={C.blue} glowColor={C.blueGlow}>
          <div style={{padding:"10px 18px",fontSize:12,color:C.dim,borderBottom:`1px solid ${C.border}`}}>Active (≥1 request) but under $10. First tracking week — all users show streak=1, none DM-eligible yet.</div>
          {LE.map(u=>(
            <div key={u.email} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 18px",borderBottom:`1px solid ${C.border}`}}>
              <span style={{flex:1,fontWeight:500,fontSize:13}}>{u.name}</span>
              <span style={{fontFamily:C.mono,fontSize:12,color:C.blue,width:65,textAlign:"right"}}>{fmt(u.spend)}</span>
              <span style={{fontSize:11,color:C.dim,width:55,textAlign:"right"}}>{u.requests} reqs</span>
              <span style={{fontSize:11,color:C.dim,width:80,textAlign:"right",fontFamily:C.mono}}>1w streak</span>
              <span style={{fontSize:10,color:C.dim,width:80,textAlign:"right"}}>first low week</span>
            </div>
          ))}
          {LE_TOTAL>20&&<div style={{padding:"8px 18px",fontSize:12,color:C.dim}}>…and {LE_TOTAL-20} more</div>}
        </FlagCard>
      </div>
    </>
  );
}

// ─── BREAKDOWNS TAB ──────────────────────────────────────────────────────────
function BreakdownsTab() {
  const ts=SUMM.totalSpend;
  return (
    <>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:18}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:14}}>Model Breakdown</div>
          {MODS.map(m=>{
            const col=m.name.includes("opus")?C.red:m.name.includes("sonnet")?C.accent:C.green;
            const pct=m.spend/ts*100;
            return (
              <div key={m.name} style={{marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:12,color:C.muted}}>{fmtModel(m.name)}</span>
                  <span style={{fontSize:12,fontFamily:C.mono,color:col}}>{fmt(m.spend)} ({pct.toFixed(1)}%)</span>
                </div>
                <Bar value={m.spend} max={MODS[0].spend} color={col}/>
                <div style={{fontSize:11,color:C.dim,marginTop:2}}>{m.requests.toLocaleString()} requests</div>
              </div>
            );
          })}
        </div>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:18}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:14}}>Product Surface Breakdown</div>
          {PRODS.map(p=>{
            const pct=p.spend/ts*100;
            return (
              <div key={p.name} style={{marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:12,color:C.muted}}>{p.name}</span>
                  <span style={{fontSize:12,fontFamily:C.mono,color:C.cyan}}>{fmt(p.spend)} ({pct.toFixed(1)}%)</span>
                </div>
                <Bar value={p.spend} max={PRODS[0].spend} color={C.cyan}/>
                <div style={{fontSize:11,color:C.dim,marginTop:2}}>{p.requests.toLocaleString()} requests · {fmt(p.spend/p.requests)}/req avg</div>
              </div>
            );
          })}
        </div>
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:18}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:14}}>Cost Per Request by Product</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:12}}>
          {PRODS.map(p=>{
            const cpr=p.spend/p.requests;
            return (
              <div key={p.name} style={{background:C.bg,borderRadius:8,padding:14,textAlign:"center"}}>
                <div style={{fontSize:11,color:C.dim,marginBottom:6}}>{p.name}</div>
                <div style={{fontSize:22,fontWeight:700,fontFamily:C.mono,color:cpr>0.3?C.orange:C.text}}>{fmt(cpr)}</div>
                <div style={{fontSize:10,color:C.dim}}>per request</div>
              </div>
            );
          })}
        </div>
      </div>
    </>
  );
}


// ─── MAIN DASHBOARD ──────────────────────────────────────────────────────────
function Dashboard() {
  const [activeTab,setActiveTab]=useState("overview");


  const flagCount=MP.length+CO.length+OH.filter(u=>u.opusSpend>=10).length+LM_TOTAL+LE_TOTAL;

  const TABS=[
    {id:"overview",l:"Overview"},{id:"leaderboard",l:"Leaderboard"},{id:"allusers",l:`All Users (${AU.length})`},
    {id:"trends",l:"Trends"},{id:"flags",l:"Flags & Alerts"},{id:"breakdowns",l:"Breakdowns"},
  ];

  return (
    <div style={{background:C.bg,color:C.text,minHeight:"100vh",fontFamily:"'Inter',system-ui,sans-serif"}}>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
      <div style={{padding:"20px 24px 0",borderBottom:`1px solid ${C.border}`}}>
        <div style={{display:"flex",alignItems:"baseline",gap:12,marginBottom:4,flexWrap:"wrap"}}>
          <h1 style={{fontSize:20,fontWeight:800,margin:0,letterSpacing:"-.03em"}}>Claude Usage Analysis</h1>
          <span style={{fontSize:13,color:C.muted,fontFamily:C.mono}}>{SUMM.weekOf}</span>
          <span style={{fontSize:11,color:C.dim,fontFamily:C.mono,marginLeft:"auto"}}>1 week in history</span>
        </div>
        <div style={{display:"flex",gap:0,marginTop:14,flexWrap:"wrap"}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setActiveTab(t.id)} style={{
              background:"none",border:"none",borderBottom:activeTab===t.id?`2px solid ${C.accent}`:"2px solid transparent",
              padding:"8px 14px",fontSize:13,fontWeight:activeTab===t.id?600:400,
              color:activeTab===t.id?C.accent:C.dim,cursor:"pointer",transition:"all .15s",fontFamily:"inherit",whiteSpace:"nowrap",
            }}>
              {t.l}{t.id==="flags"&&flagCount>0&&(
                <span style={{marginLeft:6,background:C.red,color:"#fff",fontSize:10,fontWeight:700,padding:"1px 5px",borderRadius:8}}>{flagCount}</span>
              )}
            </button>
          ))}
        </div>
      </div>
      <div style={{padding:"20px 24px"}}>
        {activeTab==="overview"&&<OverviewTab/>}
        {activeTab==="leaderboard"&&<LeaderboardTab/>}
        {activeTab==="allusers"&&<AllUsersTab/>}
        {activeTab==="trends"&&<TrendsTab/>}
        {activeTab==="flags"&&<FlagsTab/>}
        {activeTab==="breakdowns"&&<BreakdownsTab/>}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(Dashboard));
</script>
</body>
</html>
