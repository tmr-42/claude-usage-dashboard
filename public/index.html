<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
let DATA = null;
const COLORS = {
  bg: "#0a0a0f",
  card: "#111118",
  cardHover: "#16161f",
  border: "#1e1e2a",
  borderLight: "#2a2a3a",
  text: "#e4e4ef",
  textMuted: "#8888a0",
  textDim: "#555570",
  accent: "#6366f1",
  accentGlow: "rgba(99,102,241,0.15)",
  red: "#ef4444",
  redGlow: "rgba(239,68,68,0.12)",
  orange: "#f59e0b",
  orangeGlow: "rgba(245,158,11,0.12)",
  green: "#22c55e",
  greenGlow: "rgba(34,197,94,0.12)",
  purple: "#a855f7",
  purpleGlow: "rgba(168,85,247,0.12)",
  cyan: "#06b6d4",
  blue: "#3b82f6",
  blueGlow: "rgba(59,130,246,0.12)",
};

// Tab order is strict — must match Vercel build (Vercel omits "actions").
const TABS = [
  { id: "overview", label: "Overview" },
  { id: "leaderboard", label: "Leaderboard" },
  { id: "allusers", label: "All Users" },
  { id: "trends", label: "Trends" },
  { id: "flags", label: "Flags & Alerts" },
  { id: "breakdown", label: "Breakdowns" },
];

const FLAG_META = {
  "max-plan":      { label: "Max plan",      color: COLORS.red,    glow: COLORS.redGlow },
  "cowork-opus":   { label: "Cowork Opus",   color: COLORS.orange, glow: COLORS.orangeGlow },
  "opus":          { label: "Opus heavy",    color: COLORS.purple, glow: COLORS.purpleGlow },
  "token":         { label: "Tokens",        color: COLORS.orange, glow: COLORS.orangeGlow },
  "legacy":        { label: "Legacy",        color: COLORS.orange, glow: COLORS.orangeGlow },
  "low-engagement":{ label: "Low engagement",color: COLORS.blue,   glow: COLORS.blueGlow },
};

function fmt(n) { return "$" + (n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtK(n) { return n >= 1000000 ? (n/1000000).toFixed(1) + "M" : n >= 1000 ? (n/1000).toFixed(0) + "K" : (n || 0).toString(); }
function formatModel(raw) {
  const stripped = raw.replace(/^claude_/, "");
  const parts = stripped.split("_");
  if (parts.length < 2) return parts[0].charAt(0).toUpperCase() + parts[0].slice(1);
  const family = parts[0].charAt(0).toUpperCase() + parts[0].slice(1);
  return `${family} ${parts.slice(1).join(".")}`;
}

// =============================================================================
// Primitives
// =============================================================================

function Bar({ value, max, color = COLORS.accent }) {
  const pct = max > 0 ? Math.min((value / max) * 100, 100) : 0;
  return (
    <div style={{ width: "100%", height: 6, borderRadius: 3, background: COLORS.border, overflow: "hidden" }}>
      <div style={{ width: `${pct}%`, height: "100%", borderRadius: 3, background: color, transition: "width 0.4s ease" }} />
    </div>
  );
}

function ModelBar({ models }) {
  const total = (models.opus || 0) + (models.sonnet || 0) + (models.haiku || 0);
  if (total === 0) return null;
  const opus = ((models.opus || 0) / total) * 100;
  const sonnet = ((models.sonnet || 0) / total) * 100;
  const haiku = ((models.haiku || 0) / total) * 100;
  return (
    <div style={{ display: "flex", gap: 2, height: 8, borderRadius: 4, overflow: "hidden", width: "100%" }}>
      {opus > 0 && <div style={{ width: `${opus}%`, background: COLORS.red, minWidth: 2 }} title={`Opus ${opus.toFixed(0)}%`} />}
      {sonnet > 0 && <div style={{ width: `${sonnet}%`, background: COLORS.accent, minWidth: 2 }} title={`Sonnet ${sonnet.toFixed(0)}%`} />}
      {haiku > 0 && <div style={{ width: `${haiku}%`, background: COLORS.green, minWidth: 2 }} title={`Haiku ${haiku.toFixed(0)}%`} />}
    </div>
  );
}

function StatCard({ label, value, sub, color = COLORS.text }) {
  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "16px 20px", flex: "1 1 0" }}>
      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: COLORS.textMuted, marginBottom: 6, fontWeight: 500 }}>{label}</div>
      <div style={{ fontSize: 26, fontWeight: 700, color, letterSpacing: "-0.02em", fontFamily: "'JetBrains Mono', monospace" }}>{value}</div>
      {sub && <div style={{ fontSize: 12, color: COLORS.textDim, marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

function FlagPill({ type }) {
  const m = FLAG_META[type];
  if (!m) return null;
  return (
    <span style={{
      fontSize: 10, fontWeight: 600, letterSpacing: "0.04em",
      padding: "2px 7px", borderRadius: 6,
      background: m.glow, color: m.color, marginRight: 4,
    }}>{m.label}</span>
  );
}

function FlagCard({ icon, title, count, color, glowColor, children }) {
  const [open, setOpen] = useState(true);
  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, overflow: "hidden", marginBottom: 16 }}>
      <div onClick={() => setOpen(!open)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 18px", cursor: "pointer", borderBottom: open ? `1px solid ${COLORS.border}` : "none" }}>
        <span style={{ fontSize: 18 }}>{icon}</span>
        <span style={{ fontWeight: 600, fontSize: 14, color: COLORS.text, flex: 1 }}>{title}</span>
        <span style={{ background: glowColor, color, fontSize: 12, fontWeight: 700, padding: "3px 10px", borderRadius: 12 }}>{count}</span>
        <span style={{ color: COLORS.textDim, fontSize: 14, transform: open ? "rotate(180deg)" : "none", transition: "transform 0.2s" }}>▾</span>
      </div>
      {open && <div style={{ padding: 0 }}>{children}</div>}
    </div>
  );
}

// =============================================================================
// Sparkline — tiny inline trend chart for the All Users table.
// =============================================================================

function Sparkline({ values, color = COLORS.accent, width = 80, height = 22 }) {
  if (!values || values.length === 0) return <span style={{ color: COLORS.textDim, fontSize: 11 }}>—</span>;
  if (values.length === 1) {
    return (
      <svg width={width} height={height} style={{ display: "block" }}>
        <circle cx={width / 2} cy={height / 2} r={2} fill={color} />
      </svg>
    );
  }
  const max = Math.max(...values, 0.01);
  const min = Math.min(...values);
  const range = max - min || 1;
  const stepX = width / (values.length - 1);
  const points = values.map((v, i) => {
    const x = i * stepX;
    const y = height - ((v - min) / range) * (height - 4) - 2;
    return `${x},${y}`;
  }).join(" ");
  const lastX = (values.length - 1) * stepX;
  const lastY = height - ((values[values.length - 1] - min) / range) * (height - 4) - 2;
  return (
    <svg width={width} height={height} style={{ display: "block" }}>
      <polyline points={points} fill="none" stroke={color} strokeWidth={1.4} strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={lastX} cy={lastY} r={1.8} fill={color} />
    </svg>
  );
}

// =============================================================================
// LineChart — proper trend chart for org-level and per-user detail views.
// SVG-only, no chart library. Multiple series supported.
// series: [{ name, color, values: [n, ...] }, ...]
// xLabels: ["May 1", "May 8", ...]
// =============================================================================

function LineChart({ series, xLabels, height = 200, yFormat = fmt, showLegend = true }) {
  if (!series || series.length === 0 || !xLabels || xLabels.length === 0) {
    return <div style={{ color: COLORS.textDim, fontSize: 12, padding: 20, textAlign: "center" }}>No trend data yet — need at least one week of history.</div>;
  }
  const allValues = series.flatMap(s => s.values);
  const max = Math.max(...allValues, 0.01);
  const min = 0;
  const range = max - min || 1;
  const padL = 56, padR = 12, padT = 10, padB = 26;
  const width = 600;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;
  const stepX = xLabels.length > 1 ? plotW / (xLabels.length - 1) : 0;
  const yTicks = 4;

  return (
    <div style={{ width: "100%", overflowX: "auto" }}>
      <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", minWidth: 480, display: "block" }} preserveAspectRatio="xMidYMid meet">
        {/* Y gridlines + labels */}
        {Array.from({ length: yTicks + 1 }).map((_, i) => {
          const v = min + (range * i) / yTicks;
          const y = padT + plotH - (plotH * i) / yTicks;
          return (
            <g key={i}>
              <line x1={padL} y1={y} x2={width - padR} y2={y} stroke={COLORS.border} strokeWidth={0.5} />
              <text x={padL - 6} y={y + 3} fontSize={10} fill={COLORS.textDim} textAnchor="end" fontFamily="'JetBrains Mono', monospace">
                {yFormat(v).replace(".00", "")}
              </text>
            </g>
          );
        })}
        {/* X labels */}
        {xLabels.map((lbl, i) => {
          const x = padL + i * stepX;
          // Only label first, last, and every other for crowded charts
          const showLabel = xLabels.length <= 6 || i === 0 || i === xLabels.length - 1 || i % Math.ceil(xLabels.length / 6) === 0;
          if (!showLabel) return null;
          return (
            <text key={i} x={x} y={height - 8} fontSize={10} fill={COLORS.textDim} textAnchor="middle" fontFamily="'JetBrains Mono', monospace">
              {lbl}
            </text>
          );
        })}
        {/* Series lines */}
        {series.map((s, si) => {
          const points = s.values.map((v, i) => {
            const x = padL + i * stepX;
            const y = padT + plotH - ((v - min) / range) * plotH;
            return `${x},${y}`;
          }).join(" ");
          return (
            <g key={si}>
              <polyline points={points} fill="none" stroke={s.color} strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round" />
              {s.values.map((v, i) => {
                const x = padL + i * stepX;
                const y = padT + plotH - ((v - min) / range) * plotH;
                return <circle key={i} cx={x} cy={y} r={2.4} fill={s.color} />;
              })}
            </g>
          );
        })}
      </svg>
      {showLegend && series.length > 1 && (
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 6, paddingLeft: padL }}>
          {series.map((s, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: COLORS.textMuted }}>
              <span style={{ width: 10, height: 2, background: s.color, borderRadius: 1 }} />
              {s.name}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// =============================================================================
// DM section generators — EDUCATIONAL, NEVER RESTRICTIVE.
// No questions. No "let me know." No "watch your spend."
// =============================================================================









// Low Engagement DM — DRAFTED ONLY, NEVER auto-sent in bulk.
// Distinct, softer opener. Acknowledges legitimate reasons for low usage up front.
// One section, one DM (not consolidated with cost-flag DMs).


// Build one consolidated DM per user across all cost-optimization flags.
// Section order: cowork-opus → opus → token → legacy.
// Max-plan excluded. Low engagement handled separately (returned in its own array).
// Skip-list excluded. Users with <$100 total weekly spend excluded from COST DMs.




// =============================================================================
// All Users tab — sortable, searchable, expandable rows with sparklines.
// =============================================================================

function AllUsersTab({ users, history }) {
  const [sortKey, setSortKey] = useState("spend");
  const [sortDir, setSortDir] = useState("desc");
  const [search, setSearch] = useState("");
  const [expanded, setExpanded] = useState(null);

  const sorted = useMemo(() => {
    const filtered = users.filter(u => {
      if (!search) return true;
      const q = search.toLowerCase();
      const top = u.products ? Object.entries(u.products).sort((a, b) => b[1] - a[1])[0] : null;
      const topName = top ? top[0] : "";
      return u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || topName.toLowerCase().includes(q);
    });
    const dir = sortDir === "asc" ? 1 : -1;
    return [...filtered].sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (sortKey === "topProduct") {
        va = a.products ? Object.entries(a.products).sort((x, y) => y[1] - x[1])[0]?.[1] || 0 : 0;
        vb = b.products ? Object.entries(b.products).sort((x, y) => y[1] - x[1])[0]?.[1] || 0 : 0;
      }
      if (typeof va === "string") return va.localeCompare(vb) * dir;
      return ((va || 0) - (vb || 0)) * dir;
    });
  }, [users, sortKey, sortDir, search]);

  const setSort = k => {
    if (sortKey === k) setSortDir(sortDir === "asc" ? "desc" : "asc");
    else { setSortKey(k); setSortDir("desc"); }
  };

  const headers = [
    { k: "name", label: "Name" },
    { k: "email", label: "Email" },
    { k: "spend", label: "Spend" },
    { k: "requests", label: "Requests" },
    { k: "cpr", label: "$/Req" },
    { k: "avgPromptTokens", label: "Avg Tokens" },
    { k: "modelMix", label: "Model Mix", noSort: true },
    { k: "trend", label: "Trend", noSort: true },
    { k: "topProduct", label: "Top Product" },
    { k: "flags", label: "Flags", noSort: true },
  ];

  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, overflow: "hidden" }}>
      <div style={{ padding: "14px 18px", borderBottom: `1px solid ${COLORS.border}`, display: "flex", alignItems: "center", gap: 12 }}>
        <span style={{ fontSize: 13, fontWeight: 600 }}>All Active Users ({users.length})</span>
        <input
          value={search}
          onChange={e => setSearch(e.target.value)}
          placeholder="Search name, email, or product…"
          style={{
            marginLeft: "auto", background: COLORS.bg, border: `1px solid ${COLORS.border}`,
            color: COLORS.text, fontSize: 12, padding: "6px 10px", borderRadius: 6, width: 260, outline: "none",
          }}
        />
      </div>
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr style={{ borderBottom: `1px solid ${COLORS.border}` }}>
              {headers.map(h => (
                <th
                  key={h.k}
                  onClick={() => !h.noSort && setSort(h.k)}
                  style={{
                    padding: "10px 14px", textAlign: "left", fontSize: 11, color: COLORS.textDim,
                    fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em",
                    cursor: h.noSort ? "default" : "pointer", userSelect: "none",
                  }}
                >
                  {h.label}{!h.noSort && sortKey === h.k && (sortDir === "asc" ? " ↑" : " ↓")}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sorted.map(u => {
              const isOpen = expanded === u.email;
              const top = u.products ? Object.entries(u.products).sort((a, b) => b[1] - a[1])[0] : null;
              return (
                <FragmentRow
                  key={u.email}
                  u={u}
                  isOpen={isOpen}
                  onToggle={() => setExpanded(isOpen ? null : u.email)}
                  top={top}
                  history={history}
                />
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function FragmentRow({ u, isOpen, onToggle, top, history }) {
  // Determine sparkline color by trend direction
  const sparkVals = u.sparkline || [];
  let sparkColor = COLORS.textMuted;
  if (sparkVals.length >= 2) {
    const last = sparkVals[sparkVals.length - 1];
    const prev = sparkVals[sparkVals.length - 2];
    sparkColor = last > prev ? COLORS.green : last < prev ? COLORS.orange : COLORS.textMuted;
  }
  return (
    <>
      <tr onClick={onToggle} style={{ borderBottom: `1px solid ${COLORS.border}`, cursor: "pointer", background: isOpen ? COLORS.cardHover : "transparent" }}>
        <td style={{ padding: "10px 14px" }}>
          <span style={{ color: COLORS.textDim, marginRight: 6, display: "inline-block", width: 10 }}>{isOpen ? "▾" : "▸"}</span>
          <span style={{ fontWeight: 500 }}>{u.name}</span>
        </td>
        <td style={{ padding: "10px 14px", fontSize: 12, color: COLORS.textDim }}>{u.email.split("@")[0]}</td>
        <td style={{ padding: "10px 14px", fontFamily: "'JetBrains Mono', monospace", fontWeight: 600, color: u.spend > 200 ? COLORS.red : u.spend > 100 ? COLORS.orange : u.spend < 10 ? COLORS.blue : COLORS.text }}>{fmt(u.spend)}</td>
        <td style={{ padding: "10px 14px", fontFamily: "'JetBrains Mono', monospace", color: COLORS.textMuted }}>{u.requests.toLocaleString()}</td>
        <td style={{ padding: "10px 14px", fontFamily: "'JetBrains Mono', monospace", color: u.cpr > 0.5 ? COLORS.orange : COLORS.textMuted }}>{fmt(u.cpr)}</td>
        <td style={{ padding: "10px 14px", fontFamily: "'JetBrains Mono', monospace", color: COLORS.textMuted }}>{fmtK(u.avgPromptTokens || 0)}</td>
        <td style={{ padding: "10px 14px", width: 130 }}>
          <ModelBar models={u.models || {}} />
          {u.opusPct > 0 && <div style={{ fontSize: 10, color: COLORS.red, marginTop: 3 }}>{u.opusPct}% Opus</div>}
        </td>
        <td style={{ padding: "10px 14px", width: 90 }}>
          <Sparkline values={sparkVals} color={sparkColor} />
        </td>
        <td style={{ padding: "10px 14px", fontSize: 12, color: COLORS.textMuted }}>{top ? `${top[0]} (${fmt(top[1])})` : "–"}</td>
        <td style={{ padding: "10px 14px" }}>
          {(u.flags || []).map(f => <FlagPill key={f} type={f} />)}
        </td>
      </tr>
      {isOpen && <UserDetailRow u={u} history={history} />}
    </>
  );
}

function UserDetailRow({ u, history }) {
  const matrix = u.productModelMatrix;
  const userHistory = history?.userWeeks?.[u.email] || [];

  return (
    <tr>
      <td colSpan={10} style={{ padding: 0, background: COLORS.bg, borderBottom: `1px solid ${COLORS.border}` }}>
        <div style={{ padding: "16px 24px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
          <div style={{ gridColumn: "1 / -1", display: "flex", gap: 18, fontSize: 12, color: COLORS.textMuted, paddingBottom: 8, borderBottom: `1px solid ${COLORS.border}`, flexWrap: "wrap" }}>
            <div><span style={{ color: COLORS.textDim }}>Spend</span> <strong style={{ color: COLORS.text, fontFamily: "'JetBrains Mono', monospace", marginLeft: 4 }}>{fmt(u.spend)}</strong></div>
            <div><span style={{ color: COLORS.textDim }}>Requests</span> <strong style={{ color: COLORS.text, fontFamily: "'JetBrains Mono', monospace", marginLeft: 4 }}>{u.requests.toLocaleString()}</strong></div>
            <div><span style={{ color: COLORS.textDim }}>$/req</span> <strong style={{ color: COLORS.text, fontFamily: "'JetBrains Mono', monospace", marginLeft: 4 }}>{fmt(u.cpr)}</strong></div>
            <div><span style={{ color: COLORS.textDim }}>Avg prompt tokens</span> <strong style={{ color: COLORS.text, fontFamily: "'JetBrains Mono', monospace", marginLeft: 4 }}>{fmtK(u.avgPromptTokens || 0)}</strong></div>
            <div><span style={{ color: COLORS.textDim }}>Weeks tracked</span> <strong style={{ color: COLORS.text, fontFamily: "'JetBrains Mono', monospace", marginLeft: 4 }}>{userHistory.length}</strong></div>
          </div>

          {/* Per-user trend chart — full width */}
          {userHistory.length >= 1 && (
            <div style={{ gridColumn: "1 / -1" }}>
              <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", color: COLORS.textDim, marginBottom: 8 }}>
                Weekly trend ({userHistory.length} week{userHistory.length === 1 ? "" : "s"})
              </div>
              <LineChart
                series={[
                  { name: "Spend", color: COLORS.accent, values: userHistory.map(w => w.spend) },
                ]}
                xLabels={userHistory.map(w => (w.weekOf || w.weekStartISO || "").split(",")[0].split("–")[0].trim())}
                height={160}
                yFormat={fmt}
                showLegend={false}
              />
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginTop: 12 }}>
                <div>
                  <div style={{ fontSize: 10, color: COLORS.textDim, marginBottom: 4 }}>Requests over time</div>
                  <LineChart
                    series={[{ name: "Requests", color: COLORS.cyan, values: userHistory.map(w => w.requests) }]}
                    xLabels={userHistory.map(w => (w.weekOf || w.weekStartISO || "").split(",")[0].split("–")[0].trim())}
                    height={110}
                    yFormat={n => Math.round(n).toLocaleString()}
                    showLegend={false}
                  />
                </div>
                <div>
                  <div style={{ fontSize: 10, color: COLORS.textDim, marginBottom: 4 }}>Opus % over time</div>
                  <LineChart
                    series={[{ name: "Opus %", color: COLORS.red, values: userHistory.map(w => w.opusPct || 0) }]}
                    xLabels={userHistory.map(w => (w.weekOf || w.weekStartISO || "").split(",")[0].split("–")[0].trim())}
                    height={110}
                    yFormat={n => `${Math.round(n)}%`}
                    showLegend={false}
                  />
                </div>
              </div>
            </div>
          )}

          <div>
            <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", color: COLORS.textDim, marginBottom: 8 }}>Product mix (this week)</div>
            {(u.productMix || []).map(p => (
              <div key={p.name} style={{ marginBottom: 6 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}>
                  <span style={{ color: COLORS.textMuted }}>{p.name}</span>
                  <span style={{ fontFamily: "'JetBrains Mono', monospace", color: COLORS.cyan }}>{fmt(p.spend)}</span>
                </div>
                <Bar value={p.spend} max={u.spend} color={COLORS.cyan} />
              </div>
            ))}
          </div>

          <div>
            <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", color: COLORS.textDim, marginBottom: 8 }}>Model mix (this week)</div>
            {(u.modelMix || []).map(m => {
              const c = m.bucket === "opus" ? COLORS.red : m.bucket === "sonnet" ? COLORS.accent : COLORS.green;
              return (
                <div key={m.name} style={{ marginBottom: 6 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}>
                    <span style={{ color: COLORS.textMuted, fontFamily: "'JetBrains Mono', monospace", fontSize: 11 }}>{formatModel(m.name)}</span>

// Trends tab — org-level historical views.

function TrendsTab({ history }) {
  const weeks = history?.weeks || [];
  if (weeks.length === 0) {
    return (
      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 32, textAlign: "center" }}>
        <div style={{ fontSize: 14, color: COLORS.textMuted, marginBottom: 8 }}>No historical data yet</div>
        <div style={{ fontSize: 12, color: COLORS.textDim, lineHeight: 1.6, maxWidth: 480, margin: "0 auto" }}>
          Trends populate after at least one week is loaded into history. Upload one or more weekly CSVs to populate the history layer — multiple weeks can be batched on the first run.
        </div>
      </div>
    );
  }

  const xLabels = weeks.map(w => {
    // Show short date — "May 8" not "May 8–14, 2026"
    const m = w.weekOf.match(/([A-Z][a-z]+ \d+)/);
    return m ? m[1] : w.weekOf;
  });

  const totalSpendSeries = [{ name: "Total spend", color: COLORS.accent, values: weeks.map(w => w.totalSpend) }];
  const modelMixSeries = [
    { name: "Sonnet", color: COLORS.accent, values: weeks.map(w => w.sonnetSpend || 0) },
    { name: "Opus",   color: COLORS.red,    values: weeks.map(w => w.opusSpend || 0) },
    { name: "Haiku",  color: COLORS.green,  values: weeks.map(w => w.haikuSpend || 0) },
  ];
  const usersSeries = [{ name: "Active users", color: COLORS.cyan, values: weeks.map(w => w.activeUsers) }];

  const flagSeries = [
    { name: "Cowork → Opus", color: COLORS.orange, values: weeks.map(w => w.flagCounts?.coworkOpus || 0) },
    { name: "Opus heavy",    color: COLORS.purple, values: weeks.map(w => w.flagCounts?.opusHeavy || 0) },
    { name: "High tokens",   color: COLORS.orange, values: weeks.map(w => w.flagCounts?.tokenDensity || 0) },
    { name: "Legacy",        color: COLORS.textMuted, values: weeks.map(w => w.flagCounts?.legacy || 0) },
    { name: "Low engagement",color: COLORS.blue,   values: weeks.map(w => w.flagCounts?.lowEngagement || 0) },
    { name: "Max plan",      color: COLORS.red,    values: weeks.map(w => w.flagCounts?.maxPlan || 0) },
  ];

  // Top product surfaces across history
  const allProducts = new Set();
  weeks.forEach(w => Object.keys(w.productSpend || {}).forEach(p => allProducts.add(p)));
  const productList = Array.from(allProducts);
  const productColors = [COLORS.cyan, COLORS.purple, COLORS.green, COLORS.orange, COLORS.accent, COLORS.red];
  const productSeries = productList.map((p, i) => ({
    name: p,
    color: productColors[i % productColors.length],
    values: weeks.map(w => w.productSpend?.[p] || 0),
  }));

  // Week-over-week deltas for the most recent week
  const latest = weeks[weeks.length - 1];
  const prev = weeks.length > 1 ? weeks[weeks.length - 2] : null;
  const delta = (a, b) => {
    if (b == null || b === 0) return null;
    return ((a - b) / b) * 100;
  };
  const spendDelta = prev ? delta(latest.totalSpend, prev.totalSpend) : null;
  const usersDelta = prev ? delta(latest.activeUsers, prev.activeUsers) : null;
  const opusDelta  = prev ? delta(latest.opusSpend, prev.opusSpend) : null;

  const DeltaPill = ({ value, invertColors = false }) => {
    if (value == null) return <span style={{ color: COLORS.textDim, fontSize: 11 }}>—</span>;
    const up = value > 0;
    const isGood = invertColors ? !up : up;
    const c = Math.abs(value) < 1 ? COLORS.textMuted : isGood ? COLORS.green : COLORS.red;
    return (
      <span style={{ color: c, fontSize: 12, fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>
        {up ? "↑" : value < 0 ? "↓" : "→"} {Math.abs(value).toFixed(1)}%
      </span>
    );
  };

  return (
    <>
      <div style={{ display: "flex", gap: 12, marginBottom: 20, flexWrap: "wrap" }}>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "16px 20px", flex: "1 1 0" }}>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: COLORS.textMuted, marginBottom: 6, fontWeight: 500 }}>Weeks tracked</div>
          <div style={{ fontSize: 26, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace" }}>{weeks.length}</div>
          <div style={{ fontSize: 12, color: COLORS.textDim, marginTop: 4 }}>{weeks[0].weekOf} → {latest.weekOf}</div>
        </div>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "16px 20px", flex: "1 1 0" }}>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: COLORS.textMuted, marginBottom: 6, fontWeight: 500 }}>Spend WoW</div>
          <div style={{ fontSize: 26, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace" }}>{fmt(latest.totalSpend)}</div>
          <div style={{ marginTop: 4 }}><DeltaPill value={spendDelta} /></div>
        </div>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "16px 20px", flex: "1 1 0" }}>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: COLORS.textMuted, marginBottom: 6, fontWeight: 500 }}>Active Users WoW</div>
          <div style={{ fontSize: 26, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace" }}>{latest.activeUsers}</div>
          <div style={{ marginTop: 4 }}><DeltaPill value={usersDelta} /></div>
        </div>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "16px 20px", flex: "1 1 0" }}>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: COLORS.textMuted, marginBottom: 6, fontWeight: 500 }}>Opus Spend WoW</div>
          <div style={{ fontSize: 26, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", color: COLORS.red }}>{fmt(latest.opusSpend || 0)}</div>
          <div style={{ marginTop: 4 }}><DeltaPill value={opusDelta} invertColors /></div>
        </div>
      </div>

      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18, marginBottom: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>Total Org Spend Over Time</div>
        <LineChart series={totalSpendSeries} xLabels={xLabels} height={200} yFormat={fmt} />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>Active Users</div>
          <LineChart series={usersSeries} xLabels={xLabels} height={180} yFormat={n => Math.round(n).toString()} showLegend={false} />
        </div>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>Model Mix Spend</div>
          <LineChart series={modelMixSeries} xLabels={xLabels} height={180} yFormat={fmt} />
        </div>
      </div>

      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18, marginBottom: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>Flag Counts Over Time</div>
        <LineChart series={flagSeries} xLabels={xLabels} height={220} yFormat={n => Math.round(n).toString()} />
      </div>

      {productSeries.length > 0 && (
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>Product Surface Spend Over Time</div>
          <LineChart series={productSeries} xLabels={xLabels} height={220} yFormat={fmt} />
        </div>
      )}
    </>
  );
}

          <div key={u.email} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 18px", borderBottom: `1px solid ${COLORS.border}` }}>
            <span style={{ flex: 1, fontWeight: 500, fontSize: 13 }}>{u.name}</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: COLORS.red, fontWeight: 600 }}>{fmt(u.weeklySpend)}/wk</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: COLORS.textDim }}>→ ~{fmt(u.projectedMonthly)}/mo</span>
          </div>
        ))}
      </FlagCard>

      <FlagCard icon="🟠" title="Cowork → Opus (Automated Routing)" count={DATA.coworkOpus.length} color={COLORS.orange} glowColor={COLORS.orangeGlow}>
        <div style={{ padding: 14, fontSize: 12, color: COLORS.textDim, borderBottom: `1px solid ${COLORS.border}` }}>
          Highest-priority cost control. No human selected Opus. Cowork routed automatically.
        </div>
        {DATA.coworkOpus.map(u => (
          <div key={u.email} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 18px", borderBottom: `1px solid ${COLORS.border}` }}>
            <span style={{ flex: 1, fontWeight: 500, fontSize: 13 }}>{u.name}</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: COLORS.orange, fontWeight: 600 }}>{fmt(u.spend)}</span>
            <span style={{ fontSize: 12, color: COLORS.textDim }}>{u.requests} reqs</span>
            <span style={{ fontSize: 11, color: COLORS.textDim, fontFamily: "'JetBrains Mono', monospace" }}>{formatModel(u.model)}</span>
          </div>
        ))}
      </FlagCard>

      <FlagCard icon="🟣" title="Opus-Heavy Chat Users (≥30%)" count={DATA.opusHeavy.filter(u => u.opusSpend >= 10).length} color={COLORS.purple} glowColor={COLORS.purpleGlow}>
        <div style={{ padding: 14, fontSize: 12, color: COLORS.textDim, borderBottom: `1px solid ${COLORS.border}` }}>
          ≥30% of Chat spend on Opus models. Excludes Code (separate conversation). Showing users with ≥$10 Opus Chat spend.
        </div>
        {DATA.opusHeavy.filter(u => u.opusSpend >= 10).map(u => (
          <div key={u.email} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 18px", borderBottom: `1px solid ${COLORS.border}` }}>
            <span style={{ flex: 1, fontWeight: 500, fontSize: 13 }}>{u.name}</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: COLORS.purple }}>{fmt(u.opusSpend)} Opus</span>
            <span style={{ fontSize: 11, color: COLORS.textDim }}>/ {fmt(u.chatSpend)} Chat</span>
            <span style={{ background: COLORS.purpleGlow, color: COLORS.purple, fontSize: 11, fontWeight: 700, padding: "2px 8px", borderRadius: 8 }}>{u.opusPct}%</span>
          </div>
        ))}
      </FlagCard>

      <FlagCard icon="📐" title="High Token Density (>500K avg prompt)" count={DATA.tokenDensity.length} color={COLORS.orange} glowColor={COLORS.orangeGlow}>
        <div style={{ padding: 14, fontSize: 12, color: COLORS.textDim, borderBottom: `1px solid ${COLORS.border}` }}>
          Prompt architecture issue, not a model problem. Large context windows driving cost.
        </div>
        {DATA.tokenDensity.slice(0, 15).map(u => (
          <div key={u.email} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 18px", borderBottom: `1px solid ${COLORS.border}` }}>
            <span style={{ flex: 1, fontWeight: 500, fontSize: 13 }}>{u.name}</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: COLORS.orange }}>{fmtK(u.avgPromptTokens)} avg</span>
            <span style={{ fontSize: 11, color: COLORS.textDim }}>{u.requests} reqs</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: COLORS.textMuted }}>{fmt(u.spend)}</span>
          </div>
        ))}
      </FlagCard>

      <FlagCard icon="⚠️" title="Legacy Model Usage" count={DATA.legacyModels.length} color={COLORS.orange} glowColor={COLORS.orangeGlow}>
        <div style={{ padding: 14, fontSize: 12, color: COLORS.textDim, borderBottom: `1px solid ${COLORS.border}` }}>
          Deprecated model versions (4.5 and older). Should migrate to current Sonnet 4.6 / Opus 4.7.
        </div>
        {DATA.legacyModels.map(u => (
          <div key={u.email} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 18px", borderBottom: `1px solid ${COLORS.border}` }}>
            <span style={{ flex: 1, fontWeight: 500, fontSize: 13 }}>{u.name}</span>
            <span style={{ fontSize: 11, color: COLORS.textDim, fontFamily: "'JetBrains Mono', monospace" }}>{u.models.map(formatModel).join(", ")}</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: COLORS.textMuted }}>{fmt(u.spend)}</span>
          </div>
        ))}
      </FlagCard>

      {/* Low Engagement — visually distinct, separate section */}
      <div style={{ marginTop: 28, paddingTop: 20, borderTop: `1px dashed ${COLORS.borderLight}` }}>
        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", color: COLORS.blue, marginBottom: 12, fontWeight: 600 }}>
          Separate category — Engagement, not cost
        </div>
        <FlagCard icon="💧" title={`Low Engagement Users (<$10/week — ${DATA.lowEngagement.filter(u => u.dmEligible).length} of ${DATA.lowEngagement.length} DM-eligible)`} count={DATA.lowEngagement.length} color={COLORS.blue} glowColor={COLORS.blueGlow}>
          <div style={{ padding: 14, fontSize: 12, color: COLORS.textDim, borderBottom: `1px solid ${COLORS.border}` }}>
            Active in the period (≥1 request) but spent under $10. Many valid reasons for this — other tools, different workflows, time off, role mismatch. DMs are drafted ONLY for users with 2+ consecutive low-engagement weeks, to filter out one-off slow weeks. All low-engagement users are shown below; the DM-eligible column shows which ones meet the threshold.
          </div>
          {DATA.lowEngagement.map(u => (
            <div key={u.email} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 18px", borderBottom: `1px solid ${COLORS.border}` }}>
              <span style={{ flex: 1, fontWeight: 500, fontSize: 13 }}>{u.name}</span>
              <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: COLORS.blue, width: 70, textAlign: "right" }}>{fmt(u.spend)}</span>
              <span style={{ fontSize: 11, color: COLORS.textDim, width: 70, textAlign: "right" }}>{u.requests} req{u.requests === 1 ? "" : "s"}</span>
              <span style={{ fontSize: 11, color: u.consecutiveLowWeeks >= 4 ? COLORS.orange : u.consecutiveLowWeeks >= 2 ? COLORS.blue : COLORS.textDim, width: 90, textAlign: "right", fontFamily: "'JetBrains Mono', monospace" }}>{u.consecutiveLowWeeks}w streak</span>
              <span style={{ width: 90, textAlign: "right" }}>
                {u.dmEligible ? (
                  <span style={{ fontSize: 10, fontWeight: 600, padding: "2px 7px", borderRadius: 6, background: COLORS.blueGlow, color: COLORS.blue }}>DM eligible</span>
                ) : (
                  <span style={{ fontSize: 10, color: COLORS.textDim }}>first low week</span>
                )}
              </span>
            </div>
          ))}
        </FlagCard>
      </div>
    </>
  );
}

function BreakdownTab() {
  return (
    <>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 20 }}>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>Model Breakdown</div>
          {DATA.models.map(m => {
            const color = m.name.includes("opus") ? COLORS.red : m.name.includes("sonnet") ? COLORS.accent : COLORS.green;
            const label = formatModel(m.name);
            const pct = (m.spend / DATA.summary.totalSpend * 100);
            return (
              <div key={m.name} style={{ marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                  <span style={{ fontSize: 12, color: COLORS.textMuted }}>{label}</span>
                  <span style={{ fontSize: 12, fontFamily: "'JetBrains Mono', monospace", color }}>{fmt(m.spend)} ({pct.toFixed(1)}%)</span>
                </div>
                <Bar value={m.spend} max={DATA.models[0].spend} color={color} />
                <div style={{ fontSize: 11, color: COLORS.textDim, marginTop: 2 }}>{m.requests.toLocaleString()} requests</div>
              </div>
            );
          })}
        </div>

        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>Product Surface Breakdown</div>
          {DATA.products.map(p => {
            const pct = (p.spend / DATA.summary.totalSpend * 100);
            return (
              <div key={p.name} style={{ marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                  <span style={{ fontSize: 12, color: COLORS.textMuted }}>{p.name}</span>
                  <span style={{ fontSize: 12, fontFamily: "'JetBrains Mono', monospace", color: COLORS.cyan }}>{fmt(p.spend)} ({pct.toFixed(1)}%)</span>
                </div>
                <Bar value={p.spend} max={DATA.products[0].spend} color={COLORS.cyan} />
                <div style={{ fontSize: 11, color: COLORS.textDim, marginTop: 2 }}>{p.requests.toLocaleString()} requests • {fmt(p.spend / p.requests)}/req avg</div>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18 }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>Cost Per Request by Product</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12 }}>
          {DATA.products.map(p => {
            const cpr = p.spend / p.requests;
            return (
              <div key={p.name} style={{ background: COLORS.bg, borderRadius: 8, padding: 14, textAlign: "center" }}>
                <div style={{ fontSize: 11, color: COLORS.textDim, marginBottom: 6 }}>{p.name}</div>
                <div style={{ fontSize: 20, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", color: cpr > 0.3 ? COLORS.orange : COLORS.text }}>{fmt(cpr)}</div>
                <div style={{ fontSize: 10, color: COLORS.textDim }}>per request</div>
              </div>
            );
          })}
        </div>
      </div>
    </>
  );
}

fetch('data.json')
  .then(r => r.json())
  .then(d => { DATA = d; ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />); })
  .catch(e => { document.getElementById('root').innerHTML = '<div style="color:#e4e4ef;font-family:sans-serif;padding:40px">Failed to load data.json: '+e+'</div>'; });
</script>
</body>
</html>
