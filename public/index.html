<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Usage Analysis — Level Agency</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --card: #111118;
  --card-hover: #16161f;
  --border: #1e1e2a;
  --border-light: #2a2a3a;
  --text: #e4e4ef;
  --text-muted: #8888a0;
  --text-dim: #555570;
  --accent: #6366f1;
  --accent-glow: rgba(99,102,241,0.15);
  --red: #ef4444;
  --red-glow: rgba(239,68,68,0.12);
  --orange: #f59e0b;
  --orange-glow: rgba(245,158,11,0.12);
  --green: #22c55e;
  --green-glow: rgba(34,197,94,0.12);
  --purple: #a855f7;
  --purple-glow: rgba(168,85,247,0.12);
  --cyan: #06b6d4;
  --blue: #3b82f6;
  --blue-glow: rgba(59,130,246,0.12);
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); margin: 0;
  font-family: 'Inter', -apple-system, sans-serif; min-height: 100vh;
  font-size: 14px;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.container { max-width: 1200px; padding: 24px; }
.header { padding: 24px 24px 0; border-bottom: 1px solid var(--border); }
.header-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
.header h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.03em; }
.header .week { font-size: 13px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
.header .history-tag { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; margin-left: auto; }
.tabs { display: flex; gap: 0; margin-top: 16px; flex-wrap: wrap; }
.tab { background: none; border: none; color: var(--text-dim); font-size: 13px; font-weight: 600;
  padding: 8px 16px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; margin-bottom: -1px;
  font-family: inherit; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-badge { background: var(--red-glow); color: var(--red); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; margin-left: 6px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
.stat-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; flex: 1 1 0; min-width: 180px; }
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
.stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-family: 'JetBrains Mono', monospace; }
.stat-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

.section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
.section-title { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.section-subtitle { font-size: 11px; color: var(--text-dim); margin-bottom: 14px; }

.bar { width: 100%; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
.model-bar { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; width: 100%; }
.model-bar > div { min-width: 2px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead tr { border-bottom: 1px solid var(--border); }
th { padding: 10px 14px; text-align: left; font-size: 11px; color: var(--text-dim); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; user-select: none; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--text-muted); }
tbody tr { border-bottom: 1px solid var(--border); }
tbody tr.expandable { cursor: pointer; }
tbody tr.expandable:hover { background: var(--card-hover); }
td { padding: 10px 14px; }
td.mono { font-family: 'JetBrains Mono', monospace; }

.flag-pill { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 6px; margin-right: 4px; }
.flag-pill.max-plan { background: var(--red-glow); color: var(--red); }
.flag-pill.cowork-opus { background: var(--orange-glow); color: var(--orange); }
.flag-pill.opus { background: var(--purple-glow); color: var(--purple); }
.flag-pill.token { background: var(--orange-glow); color: var(--orange); }
.flag-pill.legacy { background: var(--orange-glow); color: var(--orange); }
.flag-pill.low-engagement { background: var(--blue-glow); color: var(--blue); }

.search { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 12px; padding: 6px 10px; border-radius: 6px; outline: none; font-family: inherit; width: 260px; }

.flag-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.flag-card-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; cursor: pointer; }
.flag-card-header.open { border-bottom: 1px solid var(--border); }
.flag-card-icon { font-size: 18px; }
.flag-card-title { font-weight: 600; font-size: 14px; color: var(--text); flex: 1; }
.flag-card-count { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }
.flag-card-chevron { color: var(--text-dim); font-size: 14px; transition: transform 0.2s; }
.flag-card-chevron.open { transform: rotate(180deg); }
.flag-card-body { padding: 0; }
.flag-card-body.closed { display: none; }
.flag-card-intro { padding: 14px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.flag-row { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--border); font-size: 13px; }
.flag-row:last-child { border-bottom: none; }
.flag-row .name { flex: 1; font-weight: 500; }

.low-engagement-divider { margin-top: 28px; padding-top: 20px; border-top: 1px dashed var(--border-light); }
.low-engagement-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--blue); margin-bottom: 12px; font-weight: 600; }

.detail-panel { background: var(--bg); border-bottom: 1px solid var(--border); }
.detail-panel-inner { padding: 16px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.detail-header { grid-column: 1 / -1; display: flex; gap: 18px; font-size: 12px; color: var(--text-muted); padding-bottom: 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.detail-header > div span:first-child { color: var(--text-dim); }
.detail-header strong { color: var(--text); font-family: 'JetBrains Mono', monospace; margin-left: 4px; }

.detail-subhead { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 8px; }
.detail-mix-row { margin-bottom: 6px; }
.detail-mix-row .row-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
.matrix { grid-column: 1 / -1; }
.matrix table { font-size: 12px; }
.matrix th { padding: 6px 10px; font-weight: 500; border-bottom: 1px solid var(--border); }
.matrix td { padding: 6px 10px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; }
.matrix .row-label { color: var(--text-muted); font-family: 'Inter', sans-serif; }
.matrix .totals { font-weight: 600; color: var(--text); border-top: 1px solid var(--border-light); }

.trends-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 800px) { .trends-grid { grid-template-columns: 1fr; } .detail-panel-inner { grid-template-columns: 1fr; } }

.empty { text-align: center; padding: 40px; color: var(--text-muted); }

.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; padding-left: 56px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
.legend-swatch { width: 10px; height: 2px; border-radius: 1px; }

.spend-high { color: var(--red); }
.spend-med { color: var(--orange); }
.spend-low { color: var(--blue); }
.opus-pct { color: var(--red); }
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <h1>Claude Usage Analysis</h1>
    <span class="week" id="weekOf">Loading…</span>
    <span class="history-tag" id="historyTag"></span>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="leaderboard">Leaderboard</button>
    <button class="tab" data-tab="allusers">All Users</button>
    <button class="tab" data-tab="trends">Trends</button>
    <button class="tab" data-tab="flags">Flags &amp; Alerts <span id="flagBadge" class="tab-badge" style="display:none"></span></button>
    <button class="tab" data-tab="breakdown">Breakdowns</button>
  </div>
</div>

<div class="container">
  <div id="loading" class="empty">Loading dashboard data…</div>
  <div id="error" class="empty" style="display:none; color: var(--red);"></div>
  <div id="content" style="display:none;">
    <div id="tab-overview" class="tab-content"></div>
    <div id="tab-leaderboard" class="tab-content" style="display:none"></div>
    <div id="tab-allusers" class="tab-content" style="display:none"></div>
    <div id="tab-trends" class="tab-content" style="display:none"></div>
    <div id="tab-flags" class="tab-content" style="display:none"></div>
    <div id="tab-breakdown" class="tab-content" style="display:none"></div>
  </div>
</div>

<script>
// =============================================================================
// Data loading. Reads from /public root.
// =============================================================================
let DATA = null;

async function loadData() {
  try {
    const [dataRes, historyRes] = await Promise.all([
      fetch("data.json"),
      fetch("history.json"),
    ]);
    if (!dataRes.ok) throw new Error("data.json failed to load (" + dataRes.status + ")");
    if (!historyRes.ok) throw new Error("history.json failed to load (" + historyRes.status + ")");
    DATA = await dataRes.json();
    // history.json is canonical; overwrite DATA.history with it (data.json may be stale).
    DATA.history = await historyRes.json();
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
    initialize();
  } catch (err) {
    document.getElementById("loading").style.display = "none";
    const errEl = document.getElementById("error");
    errEl.textContent = "Failed to load dashboard data: " + err.message;
    errEl.style.display = "block";
  }
}

// =============================================================================
// Formatters and helpers
// =============================================================================
const fmt = n => "$" + (n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtInt = n => Math.round(n).toLocaleString();
const fmtK = n => n >= 1000000 ? (n/1000000).toFixed(1) + "M" : n >= 1000 ? (n/1000).toFixed(0) + "K" : (n || 0).toString();
const fmtPct = n => Math.round(n) + "%";

function formatModel(raw) {
  const stripped = raw.replace(/^claude_/, "");
  const parts = stripped.split("_");
  if (parts.length < 2) return parts[0][0].toUpperCase() + parts[0].slice(1);
  const family = parts[0][0].toUpperCase() + parts[0].slice(1);
  return family + " " + parts.slice(1).join(".");
}

function modelBucket(m) {
  const l = m.toLowerCase();
  if (l.includes("opus")) return "opus";
  if (l.includes("sonnet")) return "sonnet";
  if (l.includes("haiku")) return "haiku";
  return "other";
}

function spendClass(v) {
  if (v > 200) return "spend-high";
  if (v > 100) return "spend-med";
  if (v < 10) return "spend-low";
  return "";
}

function htmlEscape(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const FLAG_LABELS = {
  "max-plan": "Max plan",
  "cowork-opus": "Cowork Opus",
  "opus": "Opus heavy",
  "token": "Tokens",
  "legacy": "Legacy",
  "low-engagement": "Low engagement",
};

function flagPills(flags) {
  if (!flags || !flags.length) return "";
  return flags.map(f => `<span class="flag-pill ${f}">${FLAG_LABELS[f] || f}</span>`).join("");
}

function modelBarHTML(models) {
  const total = (models.opus || 0) + (models.sonnet || 0) + (models.haiku || 0);
  if (total === 0) return "";
  const opus = ((models.opus || 0) / total) * 100;
  const sonnet = ((models.sonnet || 0) / total) * 100;
  const haiku = ((models.haiku || 0) / total) * 100;
  let h = '<div class="model-bar">';
  if (opus > 0) h += `<div style="width:${opus}%;background:var(--red)" title="Opus ${opus.toFixed(0)}%"></div>`;
  if (sonnet > 0) h += `<div style="width:${sonnet}%;background:var(--accent)" title="Sonnet ${sonnet.toFixed(0)}%"></div>`;
  if (haiku > 0) h += `<div style="width:${haiku}%;background:var(--green)" title="Haiku ${haiku.toFixed(0)}%"></div>`;
  h += '</div>';
  return h;
}

function sparklineHTML(values, color) {
  if (!values || values.length === 0) return '<span style="color:var(--text-dim);font-size:11px;">—</span>';
  const w = 80, h = 22;
  if (values.length === 1) {
    return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="2" fill="${color}"/></svg>`;
  }
  const max = Math.max(...values, 0.01);
  const min = Math.min(...values);
  const range = max - min || 1;
  const stepX = w / (values.length - 1);
  const points = values.map((v, i) => {
    const x = i * stepX;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    return x + "," + y;
  }).join(" ");
  const lastX = (values.length - 1) * stepX;
  const lastY = h - ((values[values.length - 1] - min) / range) * (h - 4) - 2;
  return `<svg width="${w}" height="${h}"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${lastX}" cy="${lastY}" r="1.8" fill="${color}"/></svg>`;
}

// =============================================================================
// LineChart — SVG, supports multiple series and a legend.
// series: [{ name, color, values: [n,...] }]
// xLabels: ["May 1", ...]
// =============================================================================
function lineChartHTML(series, xLabels, opts = {}) {
  const height = opts.height || 200;
  const yFormat = opts.yFormat || fmt;
  const showLegend = opts.showLegend !== false;

  if (!series || series.length === 0 || !xLabels || xLabels.length === 0) {
    return '<div class="empty" style="padding:20px;font-size:12px;">No trend data yet — need at least one week of history.</div>';
  }
  const allValues = series.flatMap(s => s.values);
  const max = Math.max(...allValues, 0.01);
  const range = max || 1;
  const padL = 56, padR = 12, padT = 10, padB = 26;
  const width = 600;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;
  const stepX = xLabels.length > 1 ? plotW / (xLabels.length - 1) : 0;
  const yTicks = 4;

  let svg = `<div style="width:100%;overflow-x:auto;"><svg viewBox="0 0 ${width} ${height}" style="width:100%;min-width:480px;display:block;" preserveAspectRatio="xMidYMid meet">`;

  // Y gridlines + labels
  for (let i = 0; i <= yTicks; i++) {
    const v = (range * i) / yTicks;
    const y = padT + plotH - (plotH * i) / yTicks;
    const lbl = yFormat(v).replace(".00", "");
    svg += `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="var(--border)" stroke-width="0.5"/>`;
    svg += `<text x="${padL - 6}" y="${y + 3}" font-size="10" fill="var(--text-dim)" text-anchor="end" font-family="'JetBrains Mono',monospace">${htmlEscape(lbl)}</text>`;
  }

  // X labels
  xLabels.forEach((lbl, i) => {
    const x = padL + i * stepX;
    const showLabel = xLabels.length <= 6 || i === 0 || i === xLabels.length - 1 || i % Math.ceil(xLabels.length / 6) === 0;
    if (showLabel) {
      svg += `<text x="${x}" y="${height - 8}" font-size="10" fill="var(--text-dim)" text-anchor="middle" font-family="'JetBrains Mono',monospace">${htmlEscape(lbl)}</text>`;
    }
  });

  // Series lines + dots
  series.forEach(s => {
    const pts = s.values.map((v, i) => {
      const x = padL + i * stepX;
      const y = padT + plotH - (v / range) * plotH;
      return x + "," + y;
    }).join(" ");
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
    s.values.forEach((v, i) => {
      const x = padL + i * stepX;
      const y = padT + plotH - (v / range) * plotH;
      svg += `<circle cx="${x}" cy="${y}" r="2.4" fill="${s.color}"/>`;
    });
  });

  svg += `</svg>`;
  if (showLegend && series.length > 1) {
    svg += `<div class="legend">`;
    series.forEach(s => {
      svg += `<div class="legend-item"><span class="legend-swatch" style="background:${s.color}"></span>${htmlEscape(s.name)}</div>`;
    });
    svg += `</div>`;
  }
  svg += `</div>`;
  return svg;
}

// =============================================================================
// Tab switching
// =============================================================================
const TAB_IDS = ["overview", "leaderboard", "allusers", "trends", "flags", "breakdown"];
function activateTab(id) {
  TAB_IDS.forEach(t => {
    document.getElementById("tab-" + t).style.display = t === id ? "block" : "none";
  });
  document.querySelectorAll(".tab").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === id);
  });
}

// =============================================================================
// Renderers per tab
// =============================================================================

function renderOverview() {
  const d = DATA;
  const flagCount =
    (d.maxPlan?.length || 0) +
    (d.coworkOpus?.length || 0) +
    ((d.opusHeavy || []).filter(u => u.opusSpend >= 10).length) +
    ((d.tokenDensity || []).filter(u => u.spend >= 20).length) +
    ((d.legacyModels || []).filter(u => u.spend >= 5).length) +
    (d.lowEngagement?.length || 0);

  let h = `
    <div class="stat-row">
      <div class="stat"><div class="stat-label">Total Org Spend</div><div class="stat-value">${fmt(d.summary.totalSpend)}</div><div class="stat-sub">1-week period</div></div>
      <div class="stat"><div class="stat-label">Active Users</div><div class="stat-value">${d.summary.activeUsers}</div><div class="stat-sub">${fmt(d.summary.avgSpend)} avg/user</div></div>
      <div class="stat"><div class="stat-label">Top 10 Concentration</div><div class="stat-value" style="color:var(--orange)">${d.summary.top10Pct}%</div><div class="stat-sub">${fmt(d.summary.top10Spend)}</div></div>
      <div class="stat"><div class="stat-label">Flags Raised</div><div class="stat-value" style="color:var(--red)">${flagCount}</div><div class="stat-sub">Action items</div></div>
    </div>

    <div class="section">
      <div class="section-title">Model Spend Distribution</div>`;
  const modelMax = d.models[0] ? d.models[0].spend : 1;
  d.models.forEach(m => {
    const pct = (m.spend / d.summary.totalSpend * 100);
    const bucket = modelBucket(m.name);
    const color = bucket === "opus" ? "var(--red)" : bucket === "sonnet" ? "var(--accent)" : bucket === "haiku" ? "var(--green)" : "var(--text-muted)";
    h += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
      <div style="width:140px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text-muted)">${htmlEscape(formatModel(m.name))}</div>
      <div style="flex:1"><div class="bar"><div class="bar-fill" style="width:${(m.spend/modelMax)*100}%;background:${color}"></div></div></div>
      <div style="width:70px;text-align:right;font-size:12px;font-family:'JetBrains Mono',monospace;color:${color}">${fmt(m.spend)}</div>
      <div style="width:40px;text-align:right;font-size:11px;color:var(--text-dim)">${pct.toFixed(0)}%</div>
    </div>`;
  });
  h += `</div>`;

  h += `<div class="section">
    <div class="section-title">Product Surface Breakdown</div>`;
  const prodMax = d.products[0] ? d.products[0].spend : 1;
  d.products.forEach(p => {
    const pct = (p.spend / d.summary.totalSpend * 100);
    h += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
      <div style="width:140px;font-size:12px;color:var(--text-muted)">${htmlEscape(p.name)}</div>
      <div style="flex:1"><div class="bar"><div class="bar-fill" style="width:${(p.spend/prodMax)*100}%;background:var(--cyan)"></div></div></div>
      <div style="width:70px;text-align:right;font-size:12px;font-family:'JetBrains Mono',monospace">${fmt(p.spend)}</div>
      <div style="width:60px;text-align:right;font-size:11px;color:var(--text-dim)">${p.requests.toLocaleString()} reqs</div>
      <div style="width:40px;text-align:right;font-size:11px;color:var(--text-dim)">${pct.toFixed(0)}%</div>
    </div>`;
  });
  h += `</div>`;

  h += `<div class="section">
    <div class="section-title" style="color:var(--green)">⚡ Power Users: Org Efficiency Benchmarks</div>
    <div class="section-subtitle">High volume, Sonnet/Haiku dominant, low cost-per-request</div>`;
  (d.powerUsers || []).forEach((u, i) => {
    const last = i === d.powerUsers.length - 1;
    h += `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;${last ? "" : "border-bottom:1px solid var(--border);"}">
      <span style="width:22px;font-size:12px;color:var(--text-dim);text-align:center">${i+1}</span>
      <span style="flex:1;font-size:13px;font-weight:500;">${htmlEscape(u.name)}</span>
      <span class="mono" style="font-size:12px;color:var(--green);width:60px;text-align:right">${u.requests} reqs</span>
      <span class="mono" style="font-size:12px;color:var(--text-muted);width:70px;text-align:right">${fmt(u.spend)}</span>

let allUsersState = { sortKey: "spend", sortDir: "desc", search: "", expanded: null };

function renderAllUsers() {
  const root = document.getElementById("tab-allusers");
  const d = DATA;
  const users = d.allUsers || [];

  let h = `<div class="card" style="overflow:hidden;">
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;">
      <span style="font-size:13px;font-weight:600;">All Active Users (${users.length})</span>
      <input id="usersSearch" class="search" placeholder="Search name, email, or product…" style="margin-left:auto;" value="${htmlEscape(allUsersState.search)}"/>
    </div>
    <div style="overflow-x:auto;"><table id="usersTable"><thead><tr id="usersHead"></tr></thead><tbody id="usersBody"></tbody></table></div>
  </div>`;
  root.innerHTML = h;

  const searchEl = document.getElementById("usersSearch");
  searchEl.addEventListener("input", e => {
    allUsersState.search = e.target.value;
    renderAllUsersTable();
  });

function renderAllUsersTable() {
  const headers = [
    { k: "name", label: "Name" },
    { k: "email", label: "Email" },
    { k: "spend", label: "Spend" },
    { k: "requests", label: "Requests" },
    { k: "cpr", label: "$/Req" },
    { k: "avgPromptTokens", label: "Avg Tokens" },
    { k: "modelMix", label: "Model Mix", noSort: true },
    { k: "trend", label: "Trend", noSort: true },
    { k: "topProduct", label: "Top Product" },
    { k: "flags", label: "Flags", noSort: true },
  ];
  const headEl = document.getElementById("usersHead");
  headEl.innerHTML = headers.map(h => {
    const arrow = !h.noSort && allUsersState.sortKey === h.k ? (allUsersState.sortDir === "asc" ? " ↑" : " ↓") : "";
    return `<th class="${h.noSort ? "" : "sortable"}" data-k="${h.k}">${h.label}${arrow}</th>`;
  }).join("");
  headEl.querySelectorAll("th.sortable").forEach(th => {
    th.addEventListener("click", () => {
      const k = th.dataset.k;
      if (allUsersState.sortKey === k) {
        allUsersState.sortDir = allUsersState.sortDir === "asc" ? "desc" : "asc";
      } else {
        allUsersState.sortKey = k;
        allUsersState.sortDir = "desc";
      }
      renderAllUsersTable();
    });
  });

  const users = DATA.allUsers || [];
  const q = allUsersState.search.toLowerCase().trim();
  const filtered = users.filter(u => {
    if (!q) return true;
    const top = u.products ? Object.entries(u.products).sort((a, b) => b[1] - a[1])[0] : null;
    const topName = top ? top[0] : "";
    return u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || topName.toLowerCase().includes(q);
  });

  const dir = allUsersState.sortDir === "asc" ? 1 : -1;
  const k = allUsersState.sortKey;
  filtered.sort((a, b) => {
    let va = a[k], vb = b[k];
    if (k === "topProduct") {
      va = a.products ? (Object.entries(a.products).sort((x, y) => y[1] - x[1])[0]?.[1] || 0) : 0;
      vb = b.products ? (Object.entries(b.products).sort((x, y) => y[1] - x[1])[0]?.[1] || 0) : 0;
    }
    if (typeof va === "string") return va.localeCompare(vb) * dir;
    return ((va || 0) - (vb || 0)) * dir;
  });

  const tbody = document.getElementById("usersBody");
  let rows = "";
  filtered.forEach(u => {
    const isOpen = allUsersState.expanded === u.email;
    const topProduct = u.products ? Object.entries(u.products).sort((a, b) => b[1] - a[1])[0] : null;
    const spendCls = spendClass(u.spend);
    const sparkVals = u.sparkline || [];
    let sparkColor = "var(--text-muted)";
    if (sparkVals.length >= 2) {
      const last = sparkVals[sparkVals.length - 1];
      const prev = sparkVals[sparkVals.length - 2];
      sparkColor = last > prev ? "var(--green)" : last < prev ? "var(--orange)" : "var(--text-muted)";
    }
    rows += `<tr class="expandable" data-email="${htmlEscape(u.email)}" ${isOpen ? 'style="background:var(--card-hover);"' : ""}>
      <td><span style="color:var(--text-dim);margin-right:6px;display:inline-block;width:10px;">${isOpen ? "▾" : "▸"}</span><span style="font-weight:500;">${htmlEscape(u.name)}</span></td>
      <td style="font-size:12px;color:var(--text-dim);">${htmlEscape(u.email.split("@")[0])}</td>
      <td class="mono" style="font-weight:600;${spendCls ? "color:var(--" + spendCls.replace("spend-","") + ");" : ""}">${fmt(u.spend)}</td>
      <td class="mono" style="color:var(--text-muted);">${u.requests.toLocaleString()}</td>
      <td class="mono" style="color:${u.cpr > 0.5 ? "var(--orange)" : "var(--text-muted)"};">${fmt(u.cpr)}</td>
      <td class="mono" style="color:var(--text-muted);">${fmtK(u.avgPromptTokens || 0)}</td>
      <td style="width:130px;">${modelBarHTML(u.models || {})}${u.opusPct > 0 ? `<div style="font-size:10px;color:var(--red);margin-top:3px;">${u.opusPct}% Opus</div>` : ""}</td>
      <td style="width:90px;">${sparklineHTML(sparkVals, sparkColor)}</td>
      <td style="font-size:12px;color:var(--text-muted);">${topProduct ? htmlEscape(topProduct[0]) + " (" + fmt(topProduct[1]) + ")" : "–"}</td>
      <td>${flagPills(u.flags || [])}</td>
    </tr>`;
    if (isOpen) {
      rows += renderUserDetailRow(u);
    }
  });
  tbody.innerHTML = rows;
  tbody.querySelectorAll("tr.expandable").forEach(tr => {
    tr.addEventListener("click", e => {
      const email = tr.dataset.email;
      allUsersState.expanded = allUsersState.expanded === email ? null : email;
      renderAllUsersTable();
    });
  });
}

function renderUserDetailRow(u) {
  const matrix = u.productModelMatrix;
  const userHistory = DATA.history?.userWeeks?.[u.email] || [];

  let detail = `<tr><td colspan="10" style="padding:0;">
    <div class="detail-panel"><div class="detail-panel-inner">
      <div class="detail-header">
        <div><span>Spend</span> <strong>${fmt(u.spend)}</strong></div>
        <div><span>Requests</span> <strong>${u.requests.toLocaleString()}</strong></div>
        <div><span>$/req</span> <strong>${fmt(u.cpr)}</strong></div>
        <div><span>Avg prompt tokens</span> <strong>${fmtK(u.avgPromptTokens || 0)}</strong></div>
        <div><span>Weeks tracked</span> <strong>${userHistory.length}</strong></div>
      </div>`;

  if (userHistory.length >= 1) {
    const labels = userHistory.map(w => w.weekOf.split(",")[0].split("–")[0].trim());
    detail += `<div style="grid-column:1 / -1;">
      <div class="detail-subhead">Weekly trend (${userHistory.length} week${userHistory.length === 1 ? "" : "s"})</div>
      ${lineChartHTML([{ name: "Spend", color: "var(--accent)", values: userHistory.map(w => w.spend) }], labels, { height: 160, yFormat: fmt, showLegend: false })}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;">
        <div>
          <div style="font-size:10px;color:var(--text-dim);margin-bottom:4px;">Requests over time</div>
          ${lineChartHTML([{ name: "Requests", color: "var(--cyan)", values: userHistory.map(w => w.requests) }], labels, { height: 110, yFormat: fmtInt, showLegend: false })}
        </div>
        <div>
          <div style="font-size:10px;color:var(--text-dim);margin-bottom:4px;">Opus % over time</div>
          ${lineChartHTML([{ name: "Opus %", color: "var(--red)", values: userHistory.map(w => w.opusPct || 0) }], labels, { height: 110, yFormat: fmtPct, showLegend: false })}
        </div>
      </div>
    </div>`;
  }

  detail += `<div>
    <div class="detail-subhead">Product mix (this week)</div>`;
  (u.productMix || []).forEach(p => {
    detail += `<div class="detail-mix-row">
      <div class="row-top"><span style="color:var(--text-muted)">${htmlEscape(p.name)}</span><span class="mono" style="color:var(--cyan)">${fmt(p.spend)}</span></div>
      <div class="bar"><div class="bar-fill" style="width:${u.spend ? Math.min(p.spend/u.spend*100, 100) : 0}%;background:var(--cyan);"></div></div>
    </div>`;
  });
  detail += `</div>`;

  detail += `<div>
    <div class="detail-subhead">Model mix (this week)</div>`;
  (u.modelMix || []).forEach(m => {
    const c = m.bucket === "opus" ? "var(--red)" : m.bucket === "sonnet" ? "var(--accent)" : "var(--green)";
    detail += `<div class="detail-mix-row">
      <div class="row-top"><span class="mono" style="color:var(--text-muted);font-size:11px;">${htmlEscape(formatModel(m.name))}</span><span class="mono" style="color:${c};">${fmt(m.spend)}</span></div>
      <div class="bar"><div class="bar-fill" style="width:${u.spend ? Math.min(m.spend/u.spend*100, 100) : 0}%;background:${c};"></div></div>
    </div>`;
  });
  detail += `</div>`;

  if (matrix && matrix.products && matrix.products.length > 0) {
    detail += `<div class="matrix">
      <div class="detail-subhead">Product × Model (this week)</div>
      <div style="overflow-x:auto;"><table><thead><tr>
        <th style="text-align:left;">Product</th>`;
    matrix.models.forEach(m => {
      detail += `<th class="mono" style="text-align:right;font-size:11px;">${htmlEscape(formatModel(m))}</th>`;
    });
    detail += `<th style="text-align:right;color:var(--text);font-weight:600;">Total</th></tr></thead><tbody>`;
    matrix.products.forEach((p, i) => {
      detail += `<tr><td class="row-label">${htmlEscape(p)}</td>`;
      matrix.rows[i].forEach(v => {
        detail += `<td style="text-align:right;color:${v > 0 ? "var(--text)" : "var(--text-dim)"};">${v > 0 ? fmt(v) : "–"}</td>`;
      });
      detail += `<td style="text-align:right;font-weight:600;">${fmt(matrix.rowTotals[i])}</td></tr>`;
    });
    detail += `<tr class="totals"><td class="row-label" style="color:var(--text);font-weight:600;">Total</td>`;
    matrix.colTotals.forEach(v => {
      detail += `<td style="text-align:right;font-weight:600;">${fmt(v)}</td>`;
    });
    detail += `<td style="text-align:right;color:var(--accent);font-weight:700;">${fmt(u.spend)}</td></tr>`;
    detail += `</tbody></table></div></div>`;
  }

  detail += `</div></div></td></tr>`;
  return detail;
}

function renderTrends() {
  const root = document.getElementById("tab-trends");
  const weeks = DATA.history?.weeks || [];
  if (weeks.length === 0) {
    root.innerHTML = `<div class="section" style="text-align:center;padding:32px;">
      <div style="font-size:14px;color:var(--text-muted);margin-bottom:8px;">No historical data yet</div>
      <div style="font-size:12px;color:var(--text-dim);line-height:1.6;max-width:480px;margin:0 auto;">Trends populate after at least one week is loaded into history.</div>
    </div>`;
    return;
  }
  const xLabels = weeks.map(w => {
    const m = w.weekOf.match(/([A-Z][a-z]+ \d+)/);
    return m ? m[1] : w.weekOf;
  });

  const latest = weeks[weeks.length - 1];
  const prev = weeks.length > 1 ? weeks[weeks.length - 2] : null;
  const delta = (a, b) => (b == null || b === 0) ? null : ((a - b) / b) * 100;
  const spendDelta = prev ? delta(latest.totalSpend, prev.totalSpend) : null;
  const usersDelta = prev ? delta(latest.activeUsers, prev.activeUsers) : null;
  const opusDelta = prev ? delta(latest.opusSpend, prev.opusSpend) : null;

  const deltaHTML = (v, invert) => {
    if (v == null) return '<span style="color:var(--text-dim);font-size:11px;">—</span>';
    const up = v > 0;
    const isGood = invert ? !up : up;
    const c = Math.abs(v) < 1 ? "var(--text-muted)" : (isGood ? "var(--green)" : "var(--red)");
    const arrow = up ? "↑" : v < 0 ? "↓" : "→";
    return `<span class="mono" style="color:${c};font-size:12px;font-weight:600;">${arrow} ${Math.abs(v).toFixed(1)}%</span>`;
  };

  let h = `<div class="stat-row">
    <div class="stat"><div class="stat-label">Weeks tracked</div><div class="stat-value">${weeks.length}</div><div class="stat-sub">${htmlEscape(weeks[0].weekOf)} → ${htmlEscape(latest.weekOf)}</div></div>
    <div class="stat"><div class="stat-label">Spend WoW</div><div class="stat-value">${fmt(latest.totalSpend)}</div><div style="margin-top:4px;">${deltaHTML(spendDelta, false)}</div></div>
    <div class="stat"><div class="stat-label">Active Users WoW</div><div class="stat-value">${latest.activeUsers}</div><div style="margin-top:4px;">${deltaHTML(usersDelta, false)}</div></div>
    <div class="stat"><div class="stat-label">Opus Spend WoW</div><div class="stat-value" style="color:var(--red);">${fmt(latest.opusSpend || 0)}</div><div style="margin-top:4px;">${deltaHTML(opusDelta, true)}</div></div>
  </div>

  <div class="section">
    <div class="section-title">Total Org Spend Over Time</div>
    ${lineChartHTML([{ name: "Total spend", color: "var(--accent)", values: weeks.map(w => w.totalSpend) }], xLabels, { height: 200, yFormat: fmt })}
  </div>

  <div class="trends-grid">
    <div class="section" style="margin-bottom:0;">
      <div class="section-title">Active Users</div>
      ${lineChartHTML([{ name: "Active users", color: "var(--cyan)", values: weeks.map(w => w.activeUsers) }], xLabels, { height: 180, yFormat: fmtInt, showLegend: false })}
    </div>
    <div class="section" style="margin-bottom:0;">
      <div class="section-title">Model Mix Spend</div>
      ${lineChartHTML([
        { name: "Sonnet", color: "var(--accent)", values: weeks.map(w => w.sonnetSpend || 0) },
        { name: "Opus", color: "var(--red)", values: weeks.map(w => w.opusSpend || 0) },
        { name: "Haiku", color: "var(--green)", values: weeks.map(w => w.haikuSpend || 0) },
      ], xLabels, { height: 180, yFormat: fmt })}
    </div>
  </div>

  <div class="section" style="margin-top:16px;">
    <div class="section-title">Flag Counts Over Time</div>
    ${lineChartHTML([
      { name: "Cowork → Opus", color: "var(--orange)", values: weeks.map(w => w.flagCounts?.coworkOpus || 0) },
      { name: "Opus heavy", color: "var(--purple)", values: weeks.map(w => w.flagCounts?.opusHeavy || 0) },
      { name: "High tokens", color: "var(--orange)", values: weeks.map(w => w.flagCounts?.tokenDensity || 0) },
      { name: "Legacy", color: "var(--text-muted)", values: weeks.map(w => w.flagCounts?.legacy || 0) },
      { name: "Low engagement", color: "var(--blue)", values: weeks.map(w => w.flagCounts?.lowEngagement || 0) },
      { name: "Max plan", color: "var(--red)", values: weeks.map(w => w.flagCounts?.maxPlan || 0) },
    ], xLabels, { height: 220, yFormat: fmtInt })}
  </div>`;

  const allProducts = new Set();
  weeks.forEach(w => Object.keys(w.productSpend || {}).forEach(p => allProducts.add(p)));
  const productList = Array.from(allProducts);
  const productColors = ["var(--cyan)", "var(--purple)", "var(--green)", "var(--orange)", "var(--accent)", "var(--red)"];
  if (productList.length > 0) {
    const productSeries = productList.map((p, i) => ({
      name: p,
      color: productColors[i % productColors.length],
      values: weeks.map(w => w.productSpend?.[p] || 0),
    }));
    h += `<div class="section">
      <div class="section-title">Product Surface Spend Over Time</div>
      ${lineChartHTML(productSeries, xLabels, { height: 220, yFormat: fmt })}
    </div>`;
  }

  root.innerHTML = h;
}

  const lowTitle = `Low Engagement Users (<$10/week — ${dmEligibleLowCount} of ${d.lowEngagement.length} DM-eligible)`;
  h += flagCardHTML("💧", lowTitle, d.lowEngagement.length, "var(--blue)", "var(--blue-glow)",
    `<div class="flag-card-intro">Active in the period (≥1 request) but spent under $10. Many valid reasons for this — other tools, different workflows, time off, role mismatch. DMs are drafted only for users with 2+ consecutive low-engagement weeks (managed in the Claude.ai artifact, not here). All low-engagement users are shown below; the streak column shows which ones meet the threshold.</div>` +
    d.lowEngagement.map(u => {
      const streakColor = u.consecutiveLowWeeks >= 4 ? "var(--orange)" : u.consecutiveLowWeeks >= 2 ? "var(--blue)" : "var(--text-dim)";
      const eligibleHTML = u.dmEligible
        ? `<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--blue-glow);color:var(--blue);">DM eligible</span>`
        : `<span style="font-size:10px;color:var(--text-dim);">first low week</span>`;
      return `<div class="flag-row">
        <span class="name">${htmlEscape(u.name)}</span>
        <span class="mono" style="color:var(--blue);width:70px;text-align:right;">${fmt(u.spend)}</span>
        <span style="font-size:11px;color:var(--text-dim);width:70px;text-align:right;">${u.requests} req${u.requests === 1 ? "" : "s"}</span>
        <span class="mono" style="font-size:11px;color:${streakColor};width:90px;text-align:right;">${u.consecutiveLowWeeks}w streak</span>
        <span style="width:90px;text-align:right;">${eligibleHTML}</span>
      </div>`;
    }).join("")
  );
  h += `</div>`;

  root.innerHTML = h;

  // Wire up collapse/expand on flag cards
  root.querySelectorAll(".flag-card-header").forEach(header => {
    header.addEventListener("click", () => {
      const body = header.nextElementSibling;
      const chev = header.querySelector(".flag-card-chevron");
      const isOpen = !body.classList.contains("closed");
      if (isOpen) {
        body.classList.add("closed");
        header.classList.remove("open");
        chev.classList.remove("open");
      } else {
        body.classList.remove("closed");
        header.classList.add("open");
        chev.classList.add("open");
      }
    });
  });
}

function flagCardHTML(icon, title, count, color, glow, body) {
  return `<div class="flag-card">
    <div class="flag-card-header open">
      <span class="flag-card-icon">${icon}</span>
      <span class="flag-card-title">${htmlEscape(title)}</span>
      <span class="flag-card-count" style="background:${glow};color:${color};">${count}</span>
      <span class="flag-card-chevron open">▾</span>
    </div>
    <div class="flag-card-body">${body}</div>
  </div>`;
}

// =============================================================================
// Breakdown tab
// =============================================================================
function renderBreakdown() {
  const d = DATA;
  const modelMax = d.models[0] ? d.models[0].spend : 1;
  const prodMax = d.products[0] ? d.products[0].spend : 1;

  let h = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
    <div class="section" style="margin-bottom:0;">
      <div class="section-title">Model Breakdown</div>`;
  d.models.forEach(m => {
    const bucket = modelBucket(m.name);
    const color = bucket === "opus" ? "var(--red)" : bucket === "sonnet" ? "var(--accent)" : bucket === "haiku" ? "var(--green)" : "var(--text-muted)";
    const pct = (m.spend / d.summary.totalSpend * 100);
    h += `<div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:12px;color:var(--text-muted);">${htmlEscape(formatModel(m.name))}</span><span class="mono" style="font-size:12px;color:${color};">${fmt(m.spend)} (${pct.toFixed(1)}%)</span></div>
      <div class="bar"><div class="bar-fill" style="width:${(m.spend/modelMax)*100}%;background:${color};"></div></div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${m.requests.toLocaleString()} requests</div>
    </div>`;
  });
  h += `</div>`;

  h += `<div class="section" style="margin-bottom:0;">
    <div class="section-title">Product Surface Breakdown</div>`;
  d.products.forEach(p => {
    const pct = (p.spend / d.summary.totalSpend * 100);
    h += `<div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:12px;color:var(--text-muted);">${htmlEscape(p.name)}</span><span class="mono" style="font-size:12px;color:var(--cyan);">${fmt(p.spend)} (${pct.toFixed(1)}%)</span></div>
      <div class="bar"><div class="bar-fill" style="width:${(p.spend/prodMax)*100}%;background:var(--cyan);"></div></div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${p.requests.toLocaleString()} requests • ${fmt(p.spend/p.requests)}/req avg</div>
    </div>`;
  });
  h += `</div></div>`;

  h += `<div class="section">
    <div class="section-title">Cost Per Request by Product</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:12px;">`;
  d.products.forEach(p => {
    const cpr = p.spend / p.requests;
    h += `<div style="background:var(--bg);border-radius:8px;padding:14px;text-align:center;">
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">${htmlEscape(p.name)}</div>
      <div class="mono" style="font-size:20px;font-weight:700;color:${cpr > 0.3 ? "var(--orange)" : "var(--text)"};">${fmt(cpr)}</div>
      <div style="font-size:10px;color:var(--text-dim);">per request</div>
    </div>`;
  });
  h += `</div></div>`;

  document.getElementById("tab-breakdown").innerHTML = h;
}

// =============================================================================
// Init
// =============================================================================
function initialize() {
  document.getElementById("weekOf").textContent = DATA.summary.weekOf;
  if (DATA.history?.weeks?.length > 0) {
    document.getElementById("historyTag").textContent = `${DATA.history.weeks.length} week${DATA.history.weeks.length === 1 ? "" : "s"} in history`;
  }

  const flagCount =
    (DATA.maxPlan?.length || 0) +
    (DATA.coworkOpus?.length || 0) +
    ((DATA.opusHeavy || []).filter(u => u.opusSpend >= 10).length) +
    ((DATA.tokenDensity || []).filter(u => u.spend >= 20).length) +
    ((DATA.legacyModels || []).filter(u => u.spend >= 5).length) +
    (DATA.lowEngagement?.length || 0);
  if (flagCount > 0) {
    const badge = document.getElementById("flagBadge");
    badge.textContent = flagCount;
    badge.style.display = "inline-block";
  }

  document.querySelectorAll(".tab").forEach(b => {
    b.addEventListener("click", () => activateTab(b.dataset.tab));
  });

  renderOverview();
  renderLeaderboard();
  renderAllUsers();
  renderTrends();
  renderFlags();
  renderBreakdown();
}

loadData();
</script>
</body>
</html>
