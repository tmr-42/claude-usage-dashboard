// =============================================================================

// Tab order is strict — must match Vercel build (Vercel omits "actions").
const TABS = [
  { id: "overview", label: "Overview" },
  { id: "leaderboard", label: "Leaderboard" },
  { id: "allusers", label: "All Users" },
  { id: "trends", label: "Trends" },
  { id: "flags", label: "Flags & Alerts" },
  { id: "breakdown", label: "Breakdowns" },
];

const FLAG_META = {
  "max-plan":      { label: "Max plan",      color: COLORS.red,    glow: COLORS.redGlow },
  "cowork-opus":   { label: "Cowork Opus",   color: COLORS.orange, glow: COLORS.orangeGlow },
  "opus":          { label: "Opus heavy",    color: COLORS.purple, glow: COLORS.purpleGlow },
  "token":         { label: "Tokens",        color: COLORS.orange, glow: COLORS.orangeGlow },
  "legacy":        { label: "Legacy",        color: COLORS.orange, glow: COLORS.orangeGlow },
  "low-engagement":{ label: "Low engagement",color: COLORS.blue,   glow: COLORS.blueGlow },
};

function fmt(n) { return "$" + (n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtK(n) { return n >= 1000000 ? (n/1000000).toFixed(1) + "M" : n >= 1000 ? (n/1000).toFixed(0) + "K" : (n || 0).toString(); }
function formatModel(raw) {
  const stripped = raw.replace(/^claude_/, "");
  const parts = stripped.split("_");
  if (parts.length < 2) return parts[0].charAt(0).toUpperCase() + parts[0].slice(1);
  const family = parts[0].charAt(0).toUpperCase() + parts[0].slice(1);
  return `${family} ${parts.slice(1).join(".")}`;
}

function Bar({ value, max, color = COLORS.accent }) {
  const pct = max > 0 ? Math.min((value / max) * 100, 100) : 0;
  return (
    <div style={{ width: "100%", height: 6, borderRadius: 3, background: COLORS.border, overflow: "hidden" }}>
      <div style={{ width: `${pct}%`, height: "100%", borderRadius: 3, background: color, transition: "width 0.4s ease" }} />

function ModelBar({ models }) {

// =============================================================================
// Sparkline — tiny inline trend chart for the All Users table.
// =============================================================================

function Sparkline({ values, color = COLORS.accent, width = 80, height = 22 }) {
  if (!values || values.length === 0) return <span style={{ color: COLORS.textDim, fontSize: 11 }}>—</span>;
  if (values.length === 1) {
    return (
      <svg width={width} height={height} style={{ display: "block" }}>
        <circle cx={width / 2} cy={height / 2} r={2} fill={color} />
      </svg>
    );
  }
  const max = Math.max(...values, 0.01);
  const min = Math.min(...values);
  const range = max - min || 1;
  const stepX = width / (values.length - 1);
  const points = values.map((v, i) => {
    const x = i * stepX;
    const y = height - ((v - min) / range) * (height - 4) - 2;
    return `${x},${y}`;
  }).join(" ");
  const lastX = (values.length - 1) * stepX;
  const lastY = height - ((values[values.length - 1] - min) / range) * (height - 4) - 2;
  return (
    <svg width={width} height={height} style={{ display: "block" }}>
      <polyline points={points} fill="none" stroke={color} strokeWidth={1.4} strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={lastX} cy={lastY} r={1.8} fill={color} />
    </svg>
  );
}

// =============================================================================
// LineChart — proper trend chart for org-level and per-user detail views.
// SVG-only, no chart library. Multiple series supported.
// series: [{ name, color, values: [n, ...] }, ...]
// xLabels: ["May 1", "May 8", ...]
// =============================================================================

function LineChart({ series, xLabels, height = 200, yFormat = fmt, showLegend = true }) {
  if (!series || series.length === 0 || !xLabels || xLabels.length === 0) {
    return <div style={{ color: COLORS.textDim, fontSize: 12, padding: 20, textAlign: "center" }}>No trend data yet — need at least one week of history.</div>;
  }
  const allValues = series.flatMap(s => s.values);
  const max = Math.max(...allValues, 0.01);
  const min = 0;
  const range = max - min || 1;
  const padL = 56, padR = 12, padT = 10, padB = 26;
  const width = 600;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;
  const stepX = xLabels.length > 1 ? plotW / (xLabels.length - 1) : 0;
  const yTicks = 4;

  return (
    <div style={{ width: "100%", overflowX: "auto" }}>
      <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", minWidth: 480, display: "block" }} preserveAspectRatio="xMidYMid meet">
        {/* Y gridlines + labels */}
        {Array.from({ length: yTicks + 1 }).map((_, i) => {
          const v = min + (range * i) / yTicks;
          const y = padT + plotH - (plotH * i) / yTicks;
          return (
            <g key={i}>
              <line x1={padL} y1={y} x2={width - padR} y2={y} stroke={COLORS.border} strokeWidth={0.5} />
              <text x={padL - 6} y={y + 3} fontSize={10} fill={COLORS.textDim} textAnchor="end" fontFamily="'JetBrains Mono', monospace">
                {yFormat(v).replace(".00", "")}
              </text>
            </g>
          );
        })}
        {/* X labels */}
        {xLabels.map((lbl, i) => {
          const x = padL + i * stepX;
          // Only label first, last, and every other for crowded charts
          const showLabel = xLabels.length <= 6 || i === 0 || i === xLabels.length - 1 || i % Math.ceil(xLabels.length / 6) === 0;
          if (!showLabel) return null;
          return (
            <text key={i} x={x} y={height - 8} fontSize={10} fill={COLORS.textDim} textAnchor="middle" fontFamily="'JetBrains Mono', monospace">
              {lbl}
            </text>
          );
        })}
        {/* Series lines */}
        {series.map((s, si) => {
          const points = s.values.map((v, i) => {
            const x = padL + i * stepX;
            const y = padT + plotH - ((v - min) / range) * plotH;
            return `${x},${y}`;
          }).join(" ");
          return (
            <g key={si}>
              <polyline points={points} fill="none" stroke={s.color} strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round" />
              {s.values.map((v, i) => {
                const x = padL + i * stepX;
                const y = padT + plotH - ((v - min) / range) * plotH;
                return <circle key={i} cx={x} cy={y} r={2.4} fill={s.color} />;
              })}
            </g>
          );
        })}
      </svg>
      {showLegend && series.length > 1 && (
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 6, paddingLeft: padL }}>
          {series.map((s, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: COLORS.textMuted }}>
              <span style={{ width: 10, height: 2, background: s.color, borderRadius: 1 }} />
              {s.name}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function sectionCoworkOpus(c) {
  return `*Cowork → Opus routing*
Your Cowork usage routed ${c.requests} requests to ${formatModel(c.model)} this week (${fmt(c.spend)}). Cowork picks the model automatically, so this isn't a manual selection on your end.
Try: in Cowork settings, set the default model to Sonnet 4.6 unless a specific workflow needs Opus. Sonnet handles automated tasks really well, and saving Opus for the workflows that genuinely benefit from it means you're matching the tool to the job.`;
}

function sectionOpus(o) {
  return `*Opus usage in Chat*
${fmt(o.opusSpend)} of your ${fmt(o.chatSpend)} Chat spend (${o.opusPct}%) was on Opus this week.
Try: set Sonnet 4.6 as your default in Chat, and reach for Opus deliberately on hard reasoning, long-form analysis, or complex code review. Sonnet is genuinely strong for most day-to-day work, and Opus shines when the problem actually needs it, which is the right time to use it.`;
}

function sectionToken(t) {
  return `*High prompt-token density*
You averaged ${fmtK(t.avgPromptTokens)} prompt tokens per request across ${t.requests} requests this week. That's well above the org average and points to context-window growth, not model choice.
Try: start a new conversation when you switch topics, and chunk large documents instead of pasting them whole. Focused prompts usually produce better, more relevant responses, since the model has less noise to work through.`;
}

function sectionLegacy(l) {
  return `*Legacy model usage*
You ran requests on deprecated versions this week (${l.models.map(formatModel).join(", ")}).
Try: switch your default to the current versions, Sonnet 4.6 and Opus 4.7. They're a straight upgrade in capability, so you'll get better results out of the same workflows.`;
}

// Low Engagement DM — DRAFTED ONLY, NEVER auto-sent in bulk.
// Distinct, softer opener. Acknowledges legitimate reasons for low usage up front.
// One section, one DM (not consolidated with cost-flag DMs).
function buildLowEngagementDM(u, totalSpend, consecutiveLowWeeks) {
  const first = u.name.split(" ")[0];
  const weeksText = consecutiveLowWeeks >= 2 ? `${consecutiveLowWeeks} consecutive weeks` : "this week";
  const greeting = `Hey ${first}, this is an automated note from the weekly Claude usage review I run for the org. There are a lot of valid reasons your usage might look light right now — different workflows, other tools that fit better, time off, or a stretch of work that doesn't lean on AI. None of that is a problem, and this isn't a nudge to spend more.`;
  const body = `*Light Claude usage pattern*
Your Claude spend has been under $10/week for ${weeksText} (${fmt(totalSpend)} across ${u.requests} request${u.requests === 1 ? "" : "s"} this past week). Sharing this in case it's useful — not because it's a flag against you.
If Claude isn't clicking for the work you're doing, I'd genuinely like to hear what's getting in the way. There might be a surface (Code, Cowork, Projects, Skills) or a workflow pattern that fits your role better, or it might just not be the right tool for this stretch of work. Both are fine answers.`;
  const closer = `No reply needed. Reach out to me directly anytime if you want to talk through anything — otherwise carry on.`;
  return [greeting, body, closer].join("\n\n");
}

// Build one consolidated DM per user across all cost-optimization flags.
// Section order: cowork-opus → opus → token → legacy.
// Max-plan excluded. Low engagement handled separately (returned in its own array).
// Skip-list excluded. Users with <$100 total weekly spend excluded from COST DMs.
function buildConsolidatedDMs(data) {
  const MIN_SPEND_FOR_COST_DM = 100;

  const spendLookup = new Map();
  (data.allUsers || data.leaderboard || []).forEach(u => spendLookup.set(u.email, u.spend));

  const eligibleForCostDM = email => {
    if (SKIP_DM.has(email)) return false;
    const totalSpend = spendLookup.get(email) || 0;
    if (totalSpend < MIN_SPEND_FOR_COST_DM) return false;
    return true;
  };

  const byUser = new Map();
  const ensure = (email, name) => {
    if (!byUser.has(email)) byUser.set(email, { email, name, sections: [], flags: [] });
    return byUser.get(email);
  };

  data.coworkOpus?.forEach(u => {
    if (!eligibleForCostDM(u.email)) return;
    const e = ensure(u.email, u.name);
    e.sections.push({ order: 1, type: "cowork-opus", text: sectionCoworkOpus(u) });
    e.flags.push("cowork-opus");
  });
  data.opusHeavy?.filter(u => u.opusSpend >= 10).forEach(u => {
    if (!eligibleForCostDM(u.email)) return;
    const e = ensure(u.email, u.name);
    e.sections.push({ order: 2, type: "opus", text: sectionOpus(u) });
    e.flags.push("opus");
  });
  data.tokenDensity?.filter(u => u.spend >= 20).forEach(u => {
    if (!eligibleForCostDM(u.email)) return;
    const e = ensure(u.email, u.name);
    e.sections.push({ order: 3, type: "token", text: sectionToken(u) });
    e.flags.push("token");
  });
  data.legacyModels?.filter(u => u.spend >= 5).forEach(u => {
    if (!eligibleForCostDM(u.email)) return;
    const e = ensure(u.email, u.name);
    e.sections.push({ order: 4, type: "legacy", text: sectionLegacy(u) });
    e.flags.push("legacy");
  });

  const costDMs = Array.from(byUser.values()).map(u => {
    u.sections.sort((a, b) => a.order - b.order);
    const first = u.name.split(" ")[0];
    const greeting = `Hey ${first}, this is an automated note from the weekly Claude usage review I run for the org. Nothing here is a restriction or a budget warning. Level wants people using Claude freely and responsibly. The point of these notes is just to share where a different model or surface might give you better results out of the same effort. Reach out to me directly anytime if you want to talk through any of it.`;
    const closer = `That's the whole message. No reply needed, no action required back to me. This is about matching the right Claude tool to the job, not pulling back on usage. If any of this is useful, share it with your team.`;
    const message = [greeting, ...u.sections.map(s => s.text), closer].join("\n\n");
    return { email: u.email, name: u.name, flags: u.flags, message, kind: "cost" };
  });

  const lowDMs = (data.lowEngagement || [])
    .filter(u => !SKIP_DM.has(u.email))
    .filter(u => u.dmEligible === true)
    .sort((a, b) => (b.consecutiveLowWeeks || 0) - (a.consecutiveLowWeeks || 0))
    .map(u => ({
      email: u.email,
      name: u.name,
      flags: ["low-engagement"],
      consecutiveLowWeeks: u.consecutiveLowWeeks,
      message: buildLowEngagementDM(u, u.spend, u.consecutiveLowWeeks),
      kind: "low-engagement",
    }));

  return { costDMs, lowDMs };
}

function generateChannelSummary(d) {
  const opusTotal = d.models.filter(m => m.name.includes("opus")).reduce((s, m) => s + m.spend, 0);
  const sonnetTotal = d.models.filter(m => m.name.includes("sonnet")).reduce((s, m) => s + m.spend, 0);
  const haikuTotal = d.models.filter(m => m.name.includes("haiku")).reduce((s, m) => s + m.spend, 0);
  const total = d.summary.totalSpend || 1;

  return `*Claude Utilization Report, ${d.summary.weekOf}*

*Spend Summary*
• Total org spend: ${fmt(d.summary.totalSpend)}
• Active users: ${d.summary.activeUsers}
• Avg spend/user: ${fmt(d.summary.avgSpend)}
• Top 10 users = ${fmt(d.summary.top10Spend)} (${d.summary.top10Pct}% of total)

*Model Mix*
• Sonnet: ${fmt(sonnetTotal)} (${(sonnetTotal / total * 100).toFixed(0)}%)
• Opus: ${fmt(opusTotal)} (${(opusTotal / total * 100).toFixed(0)}%)
• Haiku: ${fmt(haikuTotal)} (${(haikuTotal / total * 100).toFixed(0)}%)

*Flags This Week*
• Max plan candidates: ${d.maxPlan.length}${d.maxPlan.length ? ` (${d.maxPlan.map(u => u.name).join(", ")})` : ""}
• Opus-heavy Chat users (≥30%): ${d.opusHeavy.length} users totaling ${fmt(d.opusHeavy.reduce((s, u) => s + u.opusSpend, 0))} in Chat Opus
• Cowork → Opus routing: ${d.coworkOpus.length} users, ${fmt(d.coworkOpus.reduce((s, u) => s + u.spend, 0))} (highest-priority automated cost)
• High token density (>500K avg): ${d.tokenDensity.length} users
• Legacy model users: ${d.legacyModels.length} users
• Low engagement (<$10/wk): ${d.lowEngagement.length} users

*Power Users (Efficient Benchmarks)*
${d.powerUsers.slice(0, 5).map(u => `• ${u.name}: ${u.requests} reqs, ${fmt(u.cpr)}/req, ${u.opusPct}% Opus`).join("\n")}

DMs sent to flagged users with educational guidance. No replies requested. Max-plan candidates and low-engagement users surfaced here only; low-engagement DMs are drafted but require manual send.`;
}

// =============================================================================
// All Users tab — sortable, searchable, expandable rows with sparklines.
// =============================================================================

function AllUsersTab({ users, history }) {
  const [sortKey, setSortKey] = useState("spend");
  const [sortDir, setSortDir] = useState("desc");
  const [search, setSearch] = useState("");
  const [expanded, setExpanded] = useState(null);

  const sorted = useMemo(() => {
    const filtered = users.filter(u => {
      if (!search) return true;
      const q = search.toLowerCase();
      const top = u.products ? Object.entries(u.products).sort((a, b) => b[1] - a[1])[0] : null;
      const topName = top ? top[0] : "";
      return u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || topName.toLowerCase().includes(q);
    });
    const dir = sortDir === "asc" ? 1 : -1;
    return [...filtered].sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (sortKey === "topProduct") {
        va = a.products ? Object.entries(a.products).sort((x, y) => y[1] - x[1])[0]?.[1] || 0 : 0;
        vb = b.products ? Object.entries(b.products).sort((x, y) => y[1] - x[1])[0]?.[1] || 0 : 0;
      }
      if (typeof va === "string") return va.localeCompare(vb) * dir;
      return ((va || 0) - (vb || 0)) * dir;
    });
  }, [users, sortKey, sortDir, search]);

  const setSort = k => {
    if (sortKey === k) setSortDir(sortDir === "asc" ? "desc" : "asc");
    else { setSortKey(k); setSortDir("desc"); }
  };

  const headers = [
    { k: "name", label: "Name" },
    { k: "email", label: "Email" },
    { k: "spend", label: "Spend" },
    { k: "requests", label: "Requests" },
    { k: "cpr", label: "$/Req" },
    { k: "avgPromptTokens", label: "Avg Tokens" },
    { k: "modelMix", label: "Model Mix", noSort: true },
    { k: "trend", label: "Trend", noSort: true },
    { k: "topProduct", label: "Top Product" },
    { k: "flags", label: "Flags", noSort: true },
  ];

  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, overflow: "hidden" }}>
      <div style={{ padding: "14px 18px", borderBottom: `1px solid ${COLORS.border}`, display: "flex", alignItems: "center", gap: 12 }}>
        <span style={{ fontSize: 13, fontWeight: 600 }}>All Active Users ({users.length})</span>
        <input
          value={search}
          onChange={e => setSearch(e.target.value)}
          placeholder="Search name, email, or product…"
          style={{
            marginLeft: "auto", background: COLORS.bg, border: `1px solid ${COLORS.border}`,
            color: COLORS.text, fontSize: 12, padding: "6px 10px", borderRadius: 6, width: 260, outline: "none",
          }}
        />
      </div>
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr style={{ borderBottom: `1px solid ${COLORS.border}` }}>
              {headers.map(h => (
                <th
                  key={h.k}
                  onClick={() => !h.noSort && setSort(h.k)}
                  style={{
                    padding: "10px 14px", textAlign: "left", fontSize: 11, color: COLORS.textDim,
                    fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em",
                    cursor: h.noSort ? "default" : "pointer", userSelect: "none",
                  }}
                >
                  {h.label}{!h.noSort && sortKey === h.k && (sortDir === "asc" ? " ↑" : " ↓")}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sorted.map(u => {
              const isOpen = expanded === u.email;
              const top = u.products ? Object.entries(u.products).sort((a, b) => b[1] - a[1])[0] : null;
              return (
                <FragmentRow
                  key={u.email}
                  u={u}
                  isOpen={isOpen}
                  onToggle={() => setExpanded(isOpen ? null : u.email)}
                  top={top}
                  history={history}
                />
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function FragmentRow({ u, isOpen, onToggle, top, history }) {
  // Determine sparkline color by trend direction
  const sparkVals = u.sparkline || [];
  let sparkColor = COLORS.textMuted;
  if (sparkVals.length >= 2) {
    const last = sparkVals[sparkVals.length - 1];
    const prev = sparkVals[sparkVals.length - 2];
    sparkColor = last > prev ? COLORS.green : last < prev ? COLORS.orange : COLORS.textMuted;
  }
  return (
    <>
      <tr onClick={onToggle} style={{ borderBottom: `1px solid ${COLORS.border}`, cursor: "pointer", background: isOpen ? COLORS.cardHover : "transparent" }}>

function TrendsTab({ history }) {
  const weeks = history?.weeks || [];
  if (weeks.length === 0) {
    return (
      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 32, textAlign: "center" }}>
        <div style={{ fontSize: 14, color: COLORS.textMuted, marginBottom: 8 }}>No historical data yet</div>
        <div style={{ fontSize: 12, color: COLORS.textDim, lineHeight: 1.6, maxWidth: 480, margin: "0 auto" }}>
          Trends populate after at least one week is loaded into history. Upload one or more weekly CSVs to populate the history layer — multiple weeks can be batched on the first run.
        </div>
      </div>
    );
  }

  const xLabels = weeks.map(w => {
    // Show short date — "May 8" not "May 8–14, 2026"
    const m = w.weekOf.match(/([A-Z][a-z]+ \d+)/);
    return m ? m[1] : w.weekOf;
  });

  const totalSpendSeries = [{ name: "Total spend", color: COLORS.accent, values: weeks.map(w => w.totalSpend) }];
  const modelMixSeries = [
    { name: "Sonnet", color: COLORS.accent, values: weeks.map(w => w.sonnetSpend || 0) },
    { name: "Opus",   color: COLORS.red,    values: weeks.map(w => w.opusSpend || 0) },
    { name: "Haiku",  color: COLORS.green,  values: weeks.map(w => w.haikuSpend || 0) },
  ];
  const usersSeries = [{ name: "Active users", color: COLORS.cyan, values: weeks.map(w => w.activeUsers) }];

  const flagSeries = [
    { name: "Cowork → Opus", color: COLORS.orange, values: weeks.map(w => w.flagCounts?.coworkOpus || 0) },
    { name: "Opus heavy",    color: COLORS.purple, values: weeks.map(w => w.flagCounts?.opusHeavy || 0) },
    { name: "High tokens",   color: COLORS.orange, values: weeks.map(w => w.flagCounts?.tokenDensity || 0) },
    { name: "Legacy",        color: COLORS.textMuted, values: weeks.map(w => w.flagCounts?.legacy || 0) },
    { name: "Low engagement",color: COLORS.blue,   values: weeks.map(w => w.flagCounts?.lowEngagement || 0) },
    { name: "Max plan",      color: COLORS.red,    values: weeks.map(w => w.flagCounts?.maxPlan || 0) },
  ];

  // Top product surfaces across history
  const allProducts = new Set();
  weeks.forEach(w => Object.keys(w.productSpend || {}).forEach(p => allProducts.add(p)));
  const productList = Array.from(allProducts);
  const productColors = [COLORS.cyan, COLORS.purple, COLORS.green, COLORS.orange, COLORS.accent, COLORS.red];
  const productSeries = productList.map((p, i) => ({
    name: p,
    color: productColors[i % productColors.length],
    values: weeks.map(w => w.productSpend?.[p] || 0),
  }));

  // Week-over-week deltas for the most recent week
  const latest = weeks[weeks.length - 1];
  const prev = weeks.length > 1 ? weeks[weeks.length - 2] : null;
  const delta = (a, b) => {
    if (b == null || b === 0) return null;
    return ((a - b) / b) * 100;
  };
  const spendDelta = prev ? delta(latest.totalSpend, prev.totalSpend) : null;
  const usersDelta = prev ? delta(latest.activeUsers, prev.activeUsers) : null;
  const opusDelta  = prev ? delta(latest.opusSpend, prev.opusSpend) : null;

  const DeltaPill = ({ value, invertColors = false }) => {
    if (value == null) return <span style={{ color: COLORS.textDim, fontSize: 11 }}>—</span>;
    const up = value > 0;
    const isGood = invertColors ? !up : up;
    const c = Math.abs(value) < 1 ? COLORS.textMuted : isGood ? COLORS.green : COLORS.red;
    return (
      <span style={{ color: c, fontSize: 12, fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>
        {up ? "↑" : value < 0 ? "↓" : "→"} {Math.abs(value).toFixed(1)}%
      </span>
    );
  };

  return (
    <>
      <div style={{ display: "flex", gap: 12, marginBottom: 20, flexWrap: "wrap" }}>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "16px 20px", flex: "1 1 0" }}>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: COLORS.textMuted, marginBottom: 6, fontWeight: 500 }}>Weeks tracked</div>
          <div style={{ fontSize: 26, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace" }}>{weeks.length}</div>
          <div style={{ fontSize: 12, color: COLORS.textDim, marginTop: 4 }}>{weeks[0].weekOf} → {latest.weekOf}</div>
        </div>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "16px 20px", flex: "1 1 0" }}>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: COLORS.textMuted, marginBottom: 6, fontWeight: 500 }}>Spend WoW</div>
          <div style={{ fontSize: 26, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace" }}>{fmt(latest.totalSpend)}</div>
          <div style={{ marginTop: 4 }}><DeltaPill value={spendDelta} /></div>
        </div>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "16px 20px", flex: "1 1 0" }}>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: COLORS.textMuted, marginBottom: 6, fontWeight: 500 }}>Active Users WoW</div>
          <div style={{ fontSize: 26, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace" }}>{latest.activeUsers}</div>
          <div style={{ marginTop: 4 }}><DeltaPill value={usersDelta} /></div>
        </div>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "16px 20px", flex: "1 1 0" }}>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: COLORS.textMuted, marginBottom: 6, fontWeight: 500 }}>Opus Spend WoW</div>
          <div style={{ fontSize: 26, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", color: COLORS.red }}>{fmt(latest.opusSpend || 0)}</div>
          <div style={{ marginTop: 4 }}><DeltaPill value={opusDelta} invertColors /></div>
        </div>
      </div>

      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18, marginBottom: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>Total Org Spend Over Time</div>
        <LineChart series={totalSpendSeries} xLabels={xLabels} height={200} yFormat={fmt} />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>Active Users</div>
          <LineChart series={usersSeries} xLabels={xLabels} height={180} yFormat={n => Math.round(n).toString()} showLegend={false} />
        </div>
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>Model Mix Spend</div>
          <LineChart series={modelMixSeries} xLabels={xLabels} height={180} yFormat={fmt} />
        </div>
      </div>

      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18, marginBottom: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>Flag Counts Over Time</div>
        <LineChart series={flagSeries} xLabels={xLabels} height={220} yFormat={n => Math.round(n).toString()} />
      </div>

      {productSeries.length > 0 && (
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 14 }}>Product Surface Spend Over Time</div>
          <LineChart series={productSeries} xLabels={xLabels} height={220} yFormat={fmt} />
        </div>
      )}
    </>
  );
}

function SlackDMCard({ dm, state = "idle", error, onSend, isLowEngagement = false }) {
  const isSending = state === "sending";
  const isSent = state === "sent";
  const isError = state === "error";
  const baseColor = isLowEngagement ? COLORS.blue : COLORS.accent;

  const btnBg =
    isSent ? COLORS.greenGlow :
    isSending ? COLORS.textDim :
    isError ? COLORS.redGlow : baseColor;
  const btnColor =
    isSent ? COLORS.green :
    isError ? COLORS.red :
    isSending ? COLORS.text : "#fff";
  const btnLabel =
    isSent ? "✓ Sent" :
    isSending ? "Sending…" :
    isError ? "Retry send" :
    isLowEngagement ? "Send (manual review)" : "Send DM via Slack";

  return (
    <div style={{
      background: COLORS.card,
      border: `1px solid ${isLowEngagement ? COLORS.blue : COLORS.border}`,
      borderRadius: 10, padding: 16, marginBottom: 12,
      boxShadow: isLowEngagement ? `0 0 0 1px ${COLORS.blueGlow} inset` : "none",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, gap: 8 }}>
        <div>
          <span style={{ fontWeight: 600, color: COLORS.text, fontSize: 14 }}>{dm.name}</span>
          <span style={{ color: COLORS.textDim, fontSize: 12, marginLeft: 8 }}>{dm.email}</span>
        </div>
        <div style={{ display: "flex", gap: 4 }}>
          {dm.flags.map(f => <FlagPill key={f} type={f} />)}
        </div>
      </div>
      {isLowEngagement && (
        <div style={{ fontSize: 11, color: COLORS.blue, marginBottom: 10, padding: "6px 10px", background: COLORS.blueGlow, borderRadius: 6 }}>
          Drafted only. Manual send required — never sent in bulk. {dm.consecutiveLowWeeks ? `Currently on a ${dm.consecutiveLowWeeks}-week low-engagement streak.` : ""}
        </div>
      )}
      {isError && error && (
        <div style={{ background: COLORS.redGlow, border: `1px solid ${COLORS.red}`, color: COLORS.red, fontSize: 11, padding: "6px 10px", borderRadius: 6, marginBottom: 10, fontFamily: "'JetBrains Mono', monospace" }}>
          <strong>Send failed:</strong> {error}
        </div>
      )}
      <div style={{ background: "#0d0d14", borderRadius: 8, padding: 14, fontSize: 13, lineHeight: 1.6, color: COLORS.textMuted, whiteSpace: "pre-wrap", fontFamily: "'JetBrains Mono', monospace", border: `1px solid ${COLORS.border}` }}>
        {dm.message}
      </div>
      <div style={{ marginTop: 10, display: "flex", justifyContent: "flex-end" }}>
        <button
          onClick={() => (state === "idle" || state === "error") && onSend(dm.email, dm.message)}
          disabled={isSending || isSent}
          style={{
            background: btnBg, color: btnColor,
            border: "none", borderRadius: 6, padding: "7px 16px", fontSize: 12, fontWeight: 600,
            cursor: isSending || isSent ? "default" : "pointer",
            opacity: isSent ? 0.85 : 1, transition: "all 0.2s",
            minWidth: 140,
          }}
        >
          {btnLabel}
        </button>
      </div>
    </div>
  );
}

// Main dashboard
// =============================================================================

export default function Dashboard() {
  const [activeTab, setActiveTab] = useState("overview");
  // sendStates: { [key]: "idle" | "sending" | "sent" | "error", channel: same }
  // sendErrors: { [key]: errorMessage }
  const [sendStates, setSendStates] = useState({});
  const [sendErrors, setSendErrors] = useState({});

  // Call Anthropic API directly with the Slack MCP server attached.
  // Claude resolves the user via slack_search_users, then sends via slack_send_message.
  // No sendPrompt anywhere — this fires autonomously when the button is clicked.
  const callSlackMCP = async (prompt) => {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }],
        mcp_servers: [
          { type: "url", url: "https://mcp.slack.com/mcp", name: "slack" },
        ],
      }),
    });
    if (!response.ok) {
      const text = await response.text();
      throw new Error(`API ${response.status}: ${text.slice(0, 200)}`);
    }
    const data = await response.json();
    // Inspect tool-use results. If any mcp_tool_result block reports an error,
    // surface it; otherwise treat success.
    const toolResults = (data.content || []).filter(c => c.type === "mcp_tool_result");
    const errorResult = toolResults.find(r => r.is_error);
    if (errorResult) {
      const msg = errorResult.content?.[0]?.text || "Slack tool call failed";
      throw new Error(msg);
    }
    // Also catch top-level stop_reason indicating failure
    if (data.stop_reason === "error") {
      throw new Error("Anthropic API stopped with error");
    }
    return data;
  };

  const setSendState = (key, state, error = null) => {
    setSendStates(prev => ({ ...prev, [key]: state }));
    if (error) setSendErrors(prev => ({ ...prev, [key]: error }));
    else setSendErrors(prev => { const next = { ...prev }; delete next[key]; return next; });
  };

  const handleSend = async (email, message) => {
    const key = email + message.substring(0, 30);
    if (sendStates[key] === "sending" || sendStates[key] === "sent") return;
    setSendState(key, "sending");
    try {
      await callSlackMCP(
        `Send a Slack direct message to the Level Agency user with email "${email}".\n\n` +
        `First call slack_search_users with that exact email to resolve their user ID, then call slack_send_message with channel_id set to that user ID and the message text below.\n\n` +
        `Message to send:\n\n${message}`
      );
      setSendState(key, "sent");
    } catch (err) {
      setSendState(key, "error", err.message);
    }
  };

  const handleChannelSend = async () => {
    if (sendStates.channel === "sending" || sendStates.channel === "sent") return;
    setSendState("channel", "sending");
    try {
      const msg = generateChannelSummary(DATA);
      await callSlackMCP(
        `Send a Slack message to channel ID C0ANHN34VEC (the #claude-utilization channel) using slack_send_message. Use the message text below verbatim, preserving all line breaks and formatting.\n\n` +

    background:
      channelState === "sent" ? COLORS.greenGlow :
      channelState === "sending" ? COLORS.textDim :
      channelState === "error" ? COLORS.redGlow : COLORS.accent,
    color:
      channelState === "sent" ? COLORS.green :
      channelState === "error" ? COLORS.red :
      channelState === "sending" ? COLORS.text : "#fff",
    border: "none", borderRadius: 6, padding: "8px 18px", fontSize: 13, fontWeight: 600,
    cursor: channelState === "idle" || channelState === "error" ? "pointer" : "default",
    transition: "all 0.2s",
    minWidth: 160,
  };
  const channelBtnLabel =
    channelState === "sent" ? "✓ Posted to Slack" :
    channelState === "sending" ? "Posting…" :
    channelState === "error" ? "Retry post" : "Post to Channel";

  return (
    <>
      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18, marginBottom: 20 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div>
            <div style={{ fontSize: 14, fontWeight: 600 }}>#claude-utilization Channel Summary</div>
            <div style={{ fontSize: 12, color: COLORS.textDim }}>Ready-to-post weekly summary for C0ANHN34VEC</div>
          </div>
          <button
            onClick={onChannelSend}
            disabled={channelState === "sending" || channelState === "sent"}
            style={channelBtnStyle}
          >
            {channelBtnLabel}
          </button>
        </div>
        {channelState === "error" && channelError && (
          <div style={{ background: COLORS.redGlow, border: `1px solid ${COLORS.red}`, color: COLORS.red, fontSize: 12, padding: "8px 12px", borderRadius: 6, marginBottom: 12, fontFamily: "'JetBrains Mono', monospace" }}>
            <strong>Send failed:</strong> {channelError}
          </div>
        )}
        <div style={{ background: "#0d0d14", borderRadius: 8, padding: 16, fontSize: 12, lineHeight: 1.7, color: COLORS.textMuted, whiteSpace: "pre-wrap", fontFamily: "'JetBrains Mono', monospace", border: `1px solid ${COLORS.border}`, maxHeight: 300, overflow: "auto" }}>
          {generateChannelSummary(DATA)}
        </div>
      </div>

      <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>Cost-Optimization DMs ({costDMs.length})</div>
      <div style={{ fontSize: 12, color: COLORS.textDim, marginBottom: 16 }}>
        One DM per user, all cost flags consolidated. Each opens by identifying as automated. Educational, value-prop tone, never restrictive. Excluded: max-plan-only users, skip-list users, and anyone with total weekly spend under $100.
      </div>
      {costDMs.length === 0 && (
        <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18, fontSize: 13, color: COLORS.textDim, marginBottom: 28 }}>
          No cost-optimization DMs to send this week.
        </div>
      )}
      {costDMs.map((dm, i) => {
        const key = dm.email + dm.message.substring(0, 30);
        return (
          <SlackDMCard
            key={i}
            dm={dm}
            state={sendStates[key] || "idle"}
            error={sendErrors[key]}
            onSend={onSend}
          />
        );
      })}

      {lowDMs.length > 0 && (
        <>
          <div style={{ marginTop: 28, paddingTop: 20, borderTop: `1px dashed ${COLORS.borderLight}` }}>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4, color: COLORS.blue }}>Low Engagement DMs ({lowDMs.length}) — Manual Send Only</div>
            <div style={{ fontSize: 12, color: COLORS.textDim, marginBottom: 16 }}>
              Drafted as a courtesy for users with <strong style={{ color: COLORS.text }}>2 or more consecutive weeks</strong> of low engagement (&lt;$10/wk with ≥1 request). Single-week dips are not drafted — they're surfaced in Flags & Alerts but excluded here to avoid noise from one-off slow weeks. Each DM still requires individual review and a manual click. Sort by streak length to prioritize chronic patterns.
            </div>
          </div>
          {lowDMs.map((dm, i) => {
            const key = dm.email + dm.message.substring(0, 30);
            return (
              <SlackDMCard
                key={`low-${i}`}
                dm={dm}
                state={sendStates[key] || "idle"}
                error={sendErrors[key]}
                onSend={onSend}
                isLowEngagement
              />
            );
          })}
        </>
      )}
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
